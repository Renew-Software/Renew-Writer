[package]
name = "r-writer"
version = "1.4.0"
description = "Lightweight paginated word processor (.docx, .odt, .txt)"
authors = ["R-Writer Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "r_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
