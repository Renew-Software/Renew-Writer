name: Build All

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: deb
          - os: windows-latest
            target: msi
          - os: macos-latest
            target: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (For Build Scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Generate Custom Tauri Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Generate icons from your custom logo.png
          npx --yes @tauri-apps/cli icon logo.png
          
          # Fallback safeguard: if tauri icon didn't name it icon.ico directly, ensure it exists
          if [ ! -f src-tauri/icons/icon.ico ] && [ -f src-tauri/icons/32x32.png ]; then
            cp src-tauri/icons/32x32.png src-tauri/icons/icon.ico
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.target }}
