name: "Publish"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22_04
            args: ""
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 1. Install Node.js
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Automatically download the full JSZip library before build
      - name: Download JSZip dependency
        run: curl -sL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o ui/jszip.min.js

      # 3. Install Rust dependencies (Linux system packages required for WebKitGTK / Tauri)
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22_04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 4. Setup Rust toolchain
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      # 5. Build Tauri App
      - name: Tauri Build
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
