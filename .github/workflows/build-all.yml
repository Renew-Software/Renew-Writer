name: "Publish Release"

on:
  push:
    tags:
      - 'v*' # Trigger whenever a tag like v1.2.0 is pushed

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: deb
          - os: windows-latest
            target: msi
          - os: macos-latest
            target: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Generate and Verify Tauri Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          if [ -f logo.png ]; then
            npx --yes @tauri-apps/cli icon logo.png
          fi
          if [ ! -f src-tauri/icons/icon.ico ]; then
            node -e '
              const https = require("https");
              const fs = require("fs");
              const file = fs.createWriteStream("src-tauri/icons/icon.ico");
              https.get("https://raw.githubusercontent.com/tauri-apps/tauri/refs/heads/dev/examples/default/src-tauri/icons/icon.ico", (res) => {
                res.pipe(file);
              });
            '
            sleep 2
          fi

      - name: Run Tauri Action (Build & Release)
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "R-Writer ${{ github.ref_name }}"
          body: "Automated release for R-Writer version ${{ github.ref_name }}"
          draft: false
          prerelease: false
          args: --bundles ${{ matrix.target }}
