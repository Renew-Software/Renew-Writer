name: Build All

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: deb
          - os: windows-latest
            target: msi
          - os: macos-latest
            target: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (For Build Scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Tauri Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          node -e '
            const https = require("https");
            const fs = require("fs");
            const path = require("path");

            const files = [
              { name: "icon.ico", url: "https://raw.githubusercontent.com/tauri-apps/tauri/dev/examples/default/src-tauri/icons/icon.ico" },
              { name: "32x32.png", url: "https://raw.githubusercontent.com/tauri-apps/tauri/dev/examples/default/src-tauri/icons/32x32.png" },
              { name: "128x128.png", url: "https://raw.githubusercontent.com/tauri-apps/tauri/dev/examples/default/src-tauri/icons/128x128.png" },
              { name: "icon.png", url: "https://raw.githubusercontent.com/tauri-apps/tauri/dev/examples/default/src-tauri/icons/icon.png" }
            ];

            function download(url, dest) {
              return new Promise((resolve, reject) => {
                const file = fs.createWriteStream(dest);
                https.get(url, (response) => {
                  if (response.statusCode !== 200) {
                    reject(new Error(`Failed to get ${url} (Status: ${response.statusCode})`));
                    return;
                  }
                  response.pipe(file);
                  file.on("finish", () => {
                    file.close(resolve);
                  });
                }).on("error", (err) => {
                  fs.unlink(dest, () => reject(err));
                });
              });
            }

            async function main() {
              for (const file of files) {
                const dest = path.join("src-tauri", "icons", file.name);
                console.log(`Downloading ${file.name}...`);
                await download(file.url, dest);
              }
              console.log("All required Tauri icons downloaded successfully!");
            }

            main().catch(err => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.target }}
