name: Build All

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: deb
          - os: windows-latest
            target: msi
          - os: macos-latest
            target: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (For Tauri CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Auto-generate Tauri Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          node -e '
            const https = require("https");
            const fs = require("fs");
            const file = fs.createWriteStream("app-icon.png");
            https.get("https://dummyimage.com/512x512/2563eb/ffffff.png&text=App", function(response) {
              if (response.statusCode !== 200) {
                console.error("Failed to download image, status code:", response.statusCode);
                process.exit(1);
              }
              response.pipe(file);
              file.on("finish", function() {
                file.close();
                const buffer = fs.readFileSync("app-icon.png");
                const pngHeader = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
                if (!buffer.subarray(0, 8).equals(pngHeader)) {
                  console.error("Error: Downloaded file is not a valid PNG!");
                  process.exit(1);
                }
                console.log("Valid 512x512 PNG icon downloaded successfully.");
              });
            }).on("error", function(err) {
              console.error("Error downloading:", err.message);
              process.exit(1);
            });
          '
          npx --yes @tauri-apps/cli icon app-icon.png

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.target }}
