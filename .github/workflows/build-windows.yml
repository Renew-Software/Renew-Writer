name: Build R-Writer (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # Windows: NSIS installer (.exe) only
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to attach files to a GitHub Release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle JSZip locally for offline use
        run: Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" -OutFile "ui/jszip.min.js"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Windows installer (.exe)
        run: cargo tauri build --bundles nsis

      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: r-writer-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installer to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
