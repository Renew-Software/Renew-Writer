<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Writer</title>
<style>
:root{
  --bar:#ffffff; --fg:#1b1b1b; --mut:#5f5f5f; --bd:#d4d4d0; --ctl:#f1f1ee; --canvas:#6a6a6a; --warn:#fff4d6; --warnfg:#5c4300;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
}
:root[data-theme="dark"]{ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); scroll-padding-bottom:50px;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bar); z-index:30;}
body{margin:0; background:var(--canvas); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bar); border-bottom:1px solid var(--bd);}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px;}
.bar select,.bar input[type=number],.bar input[type=text],.bar button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 10px; font:inherit;}
.bar button{cursor:pointer;}
.bar button:hover{border-color:var(--mut);}
.bar input[type=number]{width:60px;}
.bar input[type=text]{width:130px;}
.bar label{color:var(--mut); font-size:13px;}
.sep{width:1px; height:20px; background:var(--bd);}
#ask{display:none; align-items:center; gap:8px; padding:6px 12px; background:var(--warn); color:var(--warnfg); font-size:13px; border-top:1px solid var(--bd);}
#ask button{background:transparent; color:inherit; border:1px solid currentColor; border-radius:6px; padding:3px 10px; font:inherit; cursor:pointer;}
.dlg{background:var(--bar); color:var(--fg); border:1px solid var(--bd); border-radius:12px; padding:16px 20px; min-width:280px; max-width:90vw; display:flex; flex-direction:column; gap:10px;}
.dlg h2{margin:0; font-size:16px; font-weight:500;}
.dlg label{display:flex; align-items:center; gap:8px; cursor:pointer;}
.dlg small{color:var(--mut);}
.dlg .row{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
.dlg button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 14px; font:inherit; cursor:pointer;}
#canvas{flex:1; background:var(--canvas); padding:20px 0 40px;}
#scaler{margin:0 auto; transform-origin:top center;}
.sheet{position:relative; background:#fff; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.35); overflow:hidden;}
.sheet .content-layer{position:absolute; border:0; outline:0; padding:0 !important; margin:0; white-space:pre-wrap; overflow-wrap:break-word; tab-size:4; pointer-events:none; box-sizing:border-box;}
.sheet textarea{position:absolute; inset:0; border:0; outline:0; resize:none; overflow:hidden; background:transparent; color:transparent; caret-color:#111; padding:0 !important; margin:0; white-space:pre-wrap; overflow-wrap:break-word; tab-size:4; z-index:2; box-sizing:border-box;}
.status{position:sticky; bottom:env(safe-area-inset-bottom,0px); z-index:20; padding:6px 12px; border-top:1px solid var(--bd); color:var(--mut); font-size:13px; background:var(--bar);}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <button id="openBtn" title="Ctrl+O">Open&hellip;</button>
      <button id="saveBtn" title="Ctrl+S">Save</button>
      <label>Name <input id="nameIn" type="text" value="document" aria-label="File name"></label>
      <span class="sep"></span>
      <select id="pageSel" aria-label="Page size"><option value="A4">A4</option><option value="A3">A3</option><option value="A5">A5</option></select>
      <select id="fontSel" aria-label="Font"></select>
      <label>Size <input id="sizeIn" type="number" min="8" max="48" value="14"> px</label>
    </div>
    <div id="ask"><span>Discard your unsaved changes?</span><button id="askYes">Discard</button><button id="askNo">Cancel</button></div>
  </div>
  <input id="fileIn" type="file" accept=".docx,.odt,.txt" hidden>
  <div id="saveDlg" style="display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); align-items:center; justify-content:center;">
    <div class="dlg" role="dialog" aria-label="Save document">
      <h2>Save document</h2>
      <label><input type="radio" name="fmt" value="docx" checked> Word document (.docx)</label>
      <label><input type="radio" name="fmt" value="odt"> OpenDocument text (.odt)</label>
      <label><input type="radio" name="fmt" value="txt"> Plain text (.txt)</label>
      <div class="row"><button id="dlgCancel">Cancel</button><button id="dlgSave">Save</button></div>
    </div>
  </div>
  <div id="canvas"><div id="scaler"><div id="pages"></div></div></div>
  <div class="status" id="status"></div>
</div>
<script src="jszip.min.js"></script>
<script>
const FONTS = [
  ["Ubuntu Light (default sans)", "Ubuntu, 'Segoe UI', system-ui, sans-serif", "Ubuntu"],
  ["Hack (default mono)", "Hack, 'DejaVu Sans Mono', Menlo, monospace", "Hack"],
  ["Liberation Serif (Times-like)", "'Liberation Serif','Times New Roman',Times,serif", "Liberation Serif"],
  ["Liberation Sans (Arial-like)", "'Liberation Sans',Arial,Helvetica,sans-serif", "Liberation Sans"],
  ["Liberation Mono (Courier-like)", "'Liberation Mono','Courier New',monospace", "Liberation Mono"],
  ["Carlito (Calibri-like)", "Carlito,Calibri,sans-serif", "Carlito"],
  ["Caladea (Cambria-like)", "Caladea,Cambria,serif", "Caladea"],
  ["DejaVu Sans", "'DejaVu Sans',Verdana,sans-serif", "DejaVu Sans"],
  ["DejaVu Serif", "'DejaVu Serif',Georgia,serif", "DejaVu Serif"]
];
const SIZES = { A3:[1123,1587], A4:[794,1123], A5:[559,794] };
const TWIPS = { A3:[16838,23811], A4:[11906,16838], A5:[8391,11906] };
const ODT_DIMS = { A3: ["297mm", "420mm"], A4: ["210mm", "297mm"], A5: ["148mm", "210mm"] };
const M = 48, GAP = 24;

let text = "", pageKey = "A4", fontIdx = 2, currentTypingSize = 14;
let sizeMap = [];
let ranges = [[0,0]], pending = null, curPage = 0, curScale = 1;
let sheets = [], contentLayers = [], tas = [];
let modified = false, message = "";

const $ = id => document.getElementById(id);
const pagesEl = $("pages"), scaler = $("scaler"), canvas = $("canvas");

const meas = document.createElement("div");
meas.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;padding:0 !important;margin:0;border:0;box-sizing:border-box;";
document.body.appendChild(meas);

FONTS.forEach((f,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=f[0]; $("fontSel").appendChild(o); });
$("fontSel").value = fontIdx;

function dims(){ const [pw,ph]=SIZES[pageKey]; return {pw, ph, cw:pw-2*M, ch:ph-2*M}; }

function measureString(str, startIndex = 0) {
  meas.style.width = dims().cw + "px";
  meas.style.fontFamily = FONTS[fontIdx][1];
  
  let html = "";
  let i = 0;
  while(i < str.length) {
    let sz = sizeMap[startIndex + i] ?? currentTypingSize;
    let run = "";
    while(i < str.length && (sizeMap[startIndex + i] ?? currentTypingSize) === sz) {
      run += str[i];
      i++;
    }
    let lh = Math.round(sz * 1.35);
    html += `<span style="font-size:${sz}px; line-height:${lh}px">${escapeHtml(run)}</span>`;
  }
  meas.innerHTML = html + "\u200b";
  return meas.offsetHeight;
}

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function fitCount(rest, maxH, startIndex){
  let lo=0, hi=rest.length;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(measureString(rest.slice(0,mid), startIndex)<=maxH) lo=mid; else hi=mid-1; }
  let k=Math.max(lo,1);
  if(k<rest.length && !/\s/.test(rest[k-1]) && !/\s/.test(rest[k])){
    for(let j=k-1;j>0;j--){ if(/\s/.test(rest[j-1])){ k=j; break; } }
  }
  return k;
}

function paginate(){
  const {ch}=dims();
  ranges=[]; let start=0;
  for(;;){
    const rest=text.slice(start);
    if(measureString(rest, start)<=ch){ ranges.push([start,text.length]); break; }
    const cut=fitCount(rest, ch, start);
    ranges.push([start,start+cut]); start+=cut;
    if(start>=text.length){ ranges.push([start,start]); break; }
  }
}

function ensureSizeMapLength(){
  while(sizeMap.length < text.length) sizeMap.push(currentTypingSize);
  if(sizeMap.length > text.length) sizeMap.length = text.length;
}

function updateTextareaSize(i) {
  const ta = tas[i];
  if(!ta) return;
  const [s] = ranges[i];
  const globalPos = s + ta.selectionStart;
  const activeSz = sizeMap[globalPos] !== undefined ? sizeMap[globalPos] : currentTypingSize;
  ta.style.fontSize = activeSz + "px";
  ta.style.lineHeight = Math.round(activeSz * 1.35) + "px";
}

function ensureSheets(n){
  const d=dims();
  while(sheets.length<n){
    const sh=document.createElement("div"); sh.className="sheet";
    const cl=document.createElement("div"); cl.className="content-layer";
    const ta=document.createElement("textarea"); ta.spellcheck=false; ta.setAttribute("aria-label","Page text");
    const idx=sheets.length;
    ta.addEventListener("input",()=>{ updateTextareaSize(idx); onInput(idx); });
    ta.addEventListener("keydown",e=>onKey(e,idx));
    ta.addEventListener("click",()=>updateTextareaSize(idx));
    ta.addEventListener("keyup",()=>updateTextareaSize(idx));
    ta.addEventListener("focus",()=>{ curPage=tas.indexOf(ta); updateTextareaSize(idx); updateStatus(); });
    sh.appendChild(cl); sh.appendChild(ta); pagesEl.appendChild(sh);
    sheets.push(sh); contentLayers.push(cl); tas.push(ta);
  }
  while(sheets.length>n){ const sh=sheets.pop(); tas.pop(); contentLayers.pop(); sh.remove(); }
  sheets.forEach((sh,i)=>{
    sh.style.width=d.pw+"px"; sh.style.height=d.ph+"px"; sh.style.marginBottom=GAP+"px";
    const cl=contentLayers[i], ta=tas[i];
    [cl, ta].forEach(el=>{
      el.style.left=M+"px"; el.style.top=M+"px"; el.style.width=d.cw+"px"; el.style.height=d.ch+"px";
      el.style.fontFamily=FONTS[fontIdx][1];
    });
    updateTextareaSize(i);
  });
}

function layoutScale(){
  const d=dims(); const avail=canvas.clientWidth-24;
  const s=Math.min(1,avail/d.pw); curScale=s;
  scaler.style.width=d.pw+"px"; scaler.style.transform="scale("+s+")";
  scaler.style.marginBottom=(-(1-s)*(ranges.length*(d.ph+GAP)))+"px";
}

function fileName(){ return ($("nameIn").value.trim()||"document"); }
function updateStatus(){
  const words=(text.match(/\S+/g)||[]).length;
  $("status").textContent="Page "+(Math.min(curPage,ranges.length-1)+1)+" of "+ranges.length+" \u00b7 "+words+" words"+(message?" \u00b7 "+message:"");
  document.title=(modified?"*":"")+fileName()+" - R-Writer";
}

function render(){
  ensureSizeMapLength();
  paginate();
  ensureSheets(ranges.length);
  ranges.forEach(([s,e],i)=>{
    const subText=text.slice(s,e);
    const ta=tas[i];
    if(ta.value!==subText) ta.value=subText;
    
    let html = "";
    let idx = s;
    while(idx < e) {
      let sz = sizeMap[idx] ?? currentTypingSize;
      let run = "";
      while(idx < e && (sizeMap[idx] ?? currentTypingSize) === sz) {
        run += text[idx];
        idx++;
      }
      let lh = Math.round(sz * 1.35);
      html += `<span style="font-size:${sz}px; line-height:${lh}px">${escapeHtml(run)}</span>`;
    }
    contentLayers[i].innerHTML = html;
  });
  layoutScale();
  if(pending){
    const g=Math.min(pending.g,text.length);
    let p=ranges.findIndex(([s,e])=>g>=s&&g<e); if(p<0) p=ranges.length-1;
    if(pending.prefer!=null && pending.prefer<ranges.length && g>=ranges[pending.prefer][0] && g<=ranges[pending.prefer][1]) p=pending.prefer;
    const local=g-ranges[p][0];
    pending=null;
    tas[p].focus(); tas[p].setSelectionRange(local,local); curPage=p;
    updateTextareaSize(p);
  }
  updateStatus();
}

function onInput(i){
  const [s,e]=ranges[i]; const ta=tas[i];
  const oldSub = text.slice(s,e);
  const newSub = ta.value;
  const cursorLocal = ta.selectionStart;
  const insertedLen = newSub.length - oldSub.length;
  
  text = text.slice(0,s) + newSub + text.slice(e);
  
  if(insertedLen > 0) {
    const newSizes = Array(insertedLen).fill(currentTypingSize);
    sizeMap.splice(s + cursorLocal - insertedLen, 0, ...newSizes);
  } else if(insertedLen < 0) {
    sizeMap.splice(s + cursorLocal, -insertedLen);
  }
  
  modified = true;
  pending = { g: s + cursorLocal, prefer: i };
  render();
}

function onKey(ev,i){
  const ta=tas[i];
  const [s,e]=ranges[i]; const local=ta.selectionStart; const v=ta.value; const n=ranges.length;
  const go=g=>{ ev.preventDefault(); pending={g}; render(); };

  if(ev.key === "Enter" && ta.selectionStart === ta.selectionEnd){
    ev.preventDefault();
    const pos = s + local;
    text = text.slice(0, pos) + "\n" + text.slice(pos);
    sizeMap.splice(pos, 0, currentTypingSize);
    modified = true;
    pending = { g: pos + 1 };
    render();
    return;
  }

  if(ev.ctrlKey||ev.metaKey||ev.altKey||ev.shiftKey) {
    setTimeout(()=>updateTextareaSize(i), 10);
    return;
  }

  switch(ev.key){
    case "Backspace":
      if(local===0 && i>0){
        ev.preventDefault();
        text=text.slice(0,s-1)+text.slice(s);
        sizeMap.splice(s-1, 1);
        modified=true;
        pending={g:s-1};
        render();
      } else {
        setTimeout(()=>updateTextareaSize(i), 10);
      }
      break;
    case "Delete":
      if(local===v.length && e<text.length){
        ev.preventDefault();
        text=text.slice(0,e)+text.slice(e+1);
        sizeMap.splice(e, 1);
        modified=true;
        pending={g:e};
        render();
      } else {
        setTimeout(()=>updateTextareaSize(i), 10);
      }
      break;
    case "ArrowLeft": if(local===0 && i>0) go(s-1); else setTimeout(()=>updateTextareaSize(i), 10); break;
    case "ArrowRight": if(local===v.length && i<n-1) go(Math.min(e+1,text.length)); else setTimeout(()=>updateTextareaSize(i), 10); break;
    default:
      setTimeout(()=>updateTextareaSize(i), 10);
      break;
  }
}

/* ---------- file formats & saving ---------- */
async function buildDocx(){
  const [w,h]=TWIPS[pageKey]; const font=escapeHtml(FONTS[fontIdx][2]);
  let body="";
  let charIdx = 0;
  for(const line of text.split("\n")){
    body+="<w:p>";
    let lineChars = line.split("");
    let i = 0;
    while(i < lineChars.length){
      if(lineChars[i] === "\t"){
        body+="<w:r><w:tab/></w:r>";
        i++; charIdx++;
        continue;
      }
      let sz = sizeMap[charIdx] ?? currentTypingSize;
      let half = Math.round(sz * 0.75 * 2);
      let runText = "";
      while(i < lineChars.length && lineChars[i] !== "\t" && (sizeMap[charIdx] ?? currentTypingSize) === sz){
        runText += lineChars[i];
        i++; charIdx++;
      }
      body+='<w:r><w:rPr><w:rFonts w:ascii="'+font+'" w:hAnsi="'+font+'"/><w:sz w:val="'+half+'"/></w:rPr><w:t xml:space="preserve">'+escapeHtml(runText)+'</w:t></w:r>';
    }
    charIdx++;
    body+="</w:p>";
  }
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="'+w+'" w:h="'+h+'"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

async function buildOdt(){
  const font=escapeHtml(FONTS[fontIdx][2]);
  const [pageW, pageH] = ODT_DIMS[pageKey] || ODT_DIMS["A4"];
  let charIdx = 0;
  let body = "";
  for(const line of text.split("\n")){
    body += '<text:p text:style-name="P1">';
    let lineChars = line.split("");
    let i = 0;
    while(i < lineChars.length){
      if(lineChars[i] === "\t"){
        body += '<text:tab/>';
        i++; charIdx++;
        continue;
      }
      let sz = sizeMap[charIdx] ?? currentTypingSize;
      let runText = "";
      while(i < lineChars.length && lineChars[i] !== "\t" && (sizeMap[charIdx] ?? currentTypingSize) === sz){
        runText += lineChars[i];
        i++; charIdx++;
      }
      body += '<text:span text:style-name="S_' + sz + '">' + escapeHtml(runText) + '</text:span>';
    }
    charIdx++;
    body += '</text:p>';
  }

  const uniqueSizes = [...new Set(sizeMap)];
  let autoStyles = '<style:style style:name="P1" style:family="paragraph"><style:paragraph-properties fo:margin-top="0cm" fo:margin-bottom="0cm"/></style:style>';
  for(const sz of uniqueSizes){
    autoStyles += '<style:style style:name="S_' + sz + '" style:family="text"><style:text-properties fo:font-size="' + (sz * 0.75) + 'pt"/></style:style>';
  }

  const zip=new JSZip();
  zip.file("mimetype","application/vnd.oasis.opendocument.text",{compression:"STORE"});
  zip.file("META-INF/manifest.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:media-type="application/vnd.oasis.opendocument.text" manifest:full-path="/"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="content.xml"/></manifest:manifest>');
  zip.file("styles.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles><style:page-layout style:name="pm1"><style:page-layout-properties fo:page-width="'+pageW+'" fo:page-height="'+pageH+'" fo:margin-top="2cm" fo:margin-bottom="2cm" fo:margin-left="2cm" fo:margin-right="2cm"/></style:page-layout></office:automatic-styles><office:master-styles><style:master-page style:name="Standard" style:page-layout-name="pm1"/></office:master-styles></office:document-styles>');
  zip.file("content.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles>' + autoStyles + '</office:automatic-styles><office:body><office:text>'+body+'</office:text></office:body></office:document-content>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

/* ---------- toolbar actions ---------- */
let afterAsk=null;
function guard(fn){ if(!modified){ fn(); return; } afterAsk=fn; $("ask").style.display="flex"; }
$("askYes").onclick=()=>{ $("ask").style.display="none"; const f=afterAsk; afterAsk=null; if(f) f(); };
$("askNo").onclick=()=>{ $("ask").style.display="none"; afterAsk=null; };

function openDlg(){ $("fileIn").value=""; $("fileIn").click(); }

$("fileIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    let t;
    if(ext==="txt") t=await f.text();
    else{
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      if(ext==="docx") t=docxText(await z.file("word/document.xml").async("string"));
      else if(ext==="odt") t=odtText(await z.file("content.xml").async("string"));
      else throw new Error("use a .docx, .odt or .txt file");
    }
    text=t; sizeMap=Array(text.length).fill(currentTypingSize); modified=false; message="Opened "+f.name;
    $("nameIn").value=f.name.replace(/\.[^.]+$/,"" );
    pending={g:0}; render();
  }catch(err){ message="Open failed: "+(err&&err.message?err.message:err); updateStatus(); }
});

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function save(fmt){
  try{
    let blob, fname;
    if(fmt === "odt"){
      blob = await buildOdt();
      fname = fileName() + ".odt";
    } else if(fmt === "txt"){
      blob = new Blob([text], {type: "text/plain;charset=utf-8"});
      fname = fileName() + ".txt";
    } else {
      blob = await buildDocx();
      fname = fileName() + ".docx";
    }
    triggerDownload(blob, fname);
    modified = false;
    message = "Saved " + fname;
  }catch(err){
    message = "Save failed: " + (err && err.message ? err.message : err);
  }
  updateStatus();
}

function showSave(){ $("saveDlg").style.display="flex"; }
$("dlgCancel").onclick=()=>{ $("saveDlg").style.display="none"; };
$("dlgSave").onclick=()=>{ $("saveDlg").style.display="none"; const f=document.querySelector('input[name="fmt"]:checked').value; save(f); };
$("openBtn").onclick=()=>guard(openDlg);
$("saveBtn").onclick=showSave;
$("nameIn").addEventListener("input",updateStatus);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("saveDlg").style.display="none";
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==="s"){ e.preventDefault(); showSave(); }
  else if(k==="o"){ e.preventDefault(); guard(openDlg); }
});

$("pageSel").addEventListener("change",e=>{ pageKey=e.target.value; keep(); });
$("fontSel").addEventListener("change",e=>{ fontIdx=+e.target.value; keep(); });

$("sizeIn").addEventListener("input", e => {
  currentTypingSize = Math.max(8, Math.min(48, +e.target.value || 14));
  if(tas[curPage]) {
    tas[curPage].focus();
    updateTextareaSize(curPage);
  }
});

function keep(){ 
  const g=tas[curPage]?ranges[curPage][0]+tas[curPage].selectionStart:0; 
  pending={g, prefer:curPage}; 
  render(); 
}
window.addEventListener("resize",layoutScale);

window.addEventListener("beforeunload", e => {
  if (modified) { e.preventDefault(); e.returnValue = ""; }
});

sizeMap = Array(text.length).fill(currentTypingSize);
render(); tas[0].focus();
</script>
</body>
</html>
