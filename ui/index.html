<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Writer</title>
<style>
:root{
  --bar:#ffffff; --fg:#1b1b1b; --mut:#5f5f5f; --bd:#d4d4d0; --ctl:#f1f1ee; --canvas:#6a6a6a; --warn:#fff4d6; --warnfg:#5c4300;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
}
:root[data-theme="dark"]{ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); scroll-padding-bottom:50px;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bar); z-index:30;}
body{margin:0; background:var(--canvas); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bar); border-bottom:1px solid var(--bd);}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px;}
.bar select,.bar input[type=number],.bar input[type=text],.bar input[type=color],.bar button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 10px; font:inherit;}
.bar input[type=color]{width:42px; min-width:42px; height:30px; padding:2px;}
.bar button{cursor:pointer;}
.bar button:hover{border-color:var(--mut);}
.bar input[type=number]{width:60px;}
.bar input[type=text]{width:130px;}
.bar label{color:var(--mut); font-size:13px;}
.sep{width:1px; height:20px; background:var(--bd);}
#ask{display:none; align-items:center; gap:8px; padding:6px 12px; background:var(--warn); color:var(--warnfg); font-size:13px; border-top:1px solid var(--bd);}
#ask button{background:transparent; color:inherit; border:1px solid currentColor; border-radius:6px; padding:3px 10px; font:inherit; cursor:pointer;}
.dlg{background:var(--bar); color:var(--fg); border:1px solid var(--bd); border-radius:12px; padding:16px 20px; min-width:280px; max-width:90vw; display:flex; flex-direction:column; gap:10px;}
.dlg h2{margin:0; font-size:16px; font-weight:500;}
.dlg label{display:flex; align-items:center; gap:8px; cursor:pointer;}
.dlg small{color:var(--mut);}
.dlg .row{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
.dlg button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 14px; font:inherit; cursor:pointer;}
#canvas{flex:1; background:var(--canvas); padding:20px 0 40px;}
#scaler{margin:0 auto; transform-origin:top center;}
.sheet{position:relative; background:#fff; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.35);}
.sheet .page-edit{position:absolute; border:0; outline:0; resize:none; overflow:hidden; background:transparent; color:inherit; padding:0; margin:0; white-space:pre-wrap; word-wrap:break-word; tab-size:4;}
.status{position:sticky; bottom:env(safe-area-inset-bottom,0px); z-index:20; padding:6px 12px; border-top:1px solid var(--bd); color:var(--mut); font-size:13px; background:var(--bar);}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <button id="openBtn" title="Ctrl+O">Open&hellip;</button>
      <button id="saveBtn" title="Ctrl+S">Save</button>
      <label>Name <input id="nameIn" type="text" value="document" aria-label="File name"></label>
      <span class="sep"></span>
      <select id="pageSel" aria-label="Page size"><option value="A4">A4</option><option value="A5">A5</option></select>
      <select id="fontSel" aria-label="Font"></select>
      <label>Color <input id="colorSel" type="color" value="#111111" aria-label="Text color"></label>
      <label>Size <input id="sizeIn" type="number" min="8" max="48" value="14"> px</label>
    </div>
    <div id="ask"><span>Discard your unsaved changes?</span><button id="askYes">Discard</button><button id="askNo">Cancel</button></div>
  </div>
  <input id="fileIn" type="file" accept=".docx,.odt,.txt" hidden>
  <div id="saveDlg" style="display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); align-items:center; justify-content:center;">
    <div class="dlg" role="dialog" aria-label="Save document">
      <h2>Save document</h2>
      <label><input type="radio" name="fmt" value="docx" checked> Word document (.docx)</label>
      <label><input type="radio" name="fmt" value="odt"> OpenDocument text (.odt)</label>
      <label><input type="radio" name="fmt" value="txt"> Plain text (.txt)</label>
      <div class="row"><button id="dlgCancel">Cancel</button><button id="dlgSave">Save</button></div>
    </div>
  </div>
  <div id="canvas"><div id="scaler"><div id="pages"></div></div></div>
  <div class="status" id="status"></div>
</div>
<script src="jszip.min.js"></script>
<script>
const FONTS = [
  ["Noto Sans", "'Noto Sans','Segoe UI',Arial,sans-serif", "Noto Sans"],
  ["Noto Serif", "'Noto Serif',Georgia,serif", "Noto Serif"],
  ["Liberation Sans", "'Liberation Sans',Arial,Helvetica,sans-serif", "Liberation Sans"],
  ["Liberation Serif", "'Liberation Serif','Times New Roman',Times,serif", "Liberation Serif"],
  ["Liberation Mono", "'Liberation Mono','Courier New',monospace", "Liberation Mono"],
  ["DejaVu Sans", "'DejaVu Sans',Verdana,sans-serif", "DejaVu Sans"],
  ["DejaVu Serif", "'DejaVu Serif',Georgia,serif", "DejaVu Serif"],
  ["Hack", "Hack,'DejaVu Sans Mono',Menlo,monospace", "Hack"],
  ["Source Sans 3", "'Source Sans 3','Segoe UI',Arial,sans-serif", "Source Sans 3"],
  ["Fira Sans", "'Fira Sans','Segoe UI',Arial,sans-serif", "Fira Sans"],
  ["Fira Mono", "'Fira Mono','Consolas',monospace", "Fira Mono"],
  ["IBM Plex Sans", "'IBM Plex Sans','Segoe UI',Arial,sans-serif", "IBM Plex Sans"],
  ["IBM Plex Mono", "'IBM Plex Mono','Consolas',monospace", "IBM Plex Mono"]
];

const SIZES = { A4:[794,1123], A5:[560,794] };
const TWIPS = { A4:[11906,16838], A5:[8395,11908] };
const M = 48, GAP = 24;
const DEFAULT_COLOR = "#111111";

let text = "", pageKey = "A4", fontIdx = 0, size = 14;
let currentColor = DEFAULT_COLOR;
let ranges = [[0,0]], pending = null, curPage = 0, curScale = 1;
let tas = [], sheets = [], sizeMap = [], colorMap = [], lineHeightMap = [];
let modified = false, message = "";
let savedCaret = null;

const $ = id => document.getElementById(id);
const pagesEl = $("pages"), scaler = $("scaler"), canvas = $("canvas");

const meas = document.createElement("div");
meas.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;padding:0;margin:0;border:0;box-sizing:content-box;";
document.body.appendChild(meas);

FONTS.forEach((f,i)=>{
  const o=document.createElement("option");
  o.value=i;
  o.textContent=f[0];
  $("fontSel").appendChild(o);
});
$("fontSel").value = fontIdx;
$("colorSel").value = currentColor;

function dims(){
  const [pw,ph]=SIZES[pageKey];
  return {
    pw,
    ph,
    cw:pw-2*M,
    ch:ph-2*M,
    lh:Math.ceil(size * 1.35)
  };
}

function applyMeas(){
  const d=dims();
  meas.style.width=d.cw+"px";
  meas.style.fontFamily=FONTS[fontIdx][1];
  meas.style.fontSize=size+"px";
  meas.style.lineHeight=d.lh+"px";
}

function heightRange(start, end){
  if(end <= start) return dims().lh;
  meas.innerHTML = buildPageHtml(
    text.slice(start, end),
    sizeMap.slice(start, end),
    colorMap.slice(start, end),
    lineHeightMap.slice(start, end)
  ) + '<span style="font-size:' + size + 'px;line-height:' + dims().lh + 'px;">\u200b</span>';
  return meas.offsetHeight;
}

function rowOfRange(start, end){
  const h = heightRange(start, end);
  const lastLh = end > start ? (lineHeightMap[end - 1] || dims().lh) : dims().lh;
  return Math.max(0, Math.round(h / lastLh) - 1);
}

function rowStart(pageStart, off){
  const r = rowOfRange(pageStart, pageStart + off);
  let lo = 0, hi = off;
  while(lo < hi){
    const mid = (lo + hi) >> 1;
    if(rowOfRange(pageStart, pageStart + mid) >= r) hi = mid;
    else lo = mid + 1;
  }
  return lo;
}

function fitCount(start, maxH){
  const maxLen = text.length - start;
  let lo = 0, hi = maxLen;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(heightRange(start, start + mid) <= maxH) lo = mid;
    else hi = mid - 1;
  }
  let k = Math.max(lo, 1);
  if(k < maxLen && !/\s/.test(text[start + k - 1]) && !/\s/.test(text[start + k])){
    for(let j = k - 1; j > 0; j--){
      if(/\s/.test(text[start + j - 1])){ k = j; break; }
    }
  }
  return k;
}

function paginate(){
  applyMeas();
  const {ch}=dims();
  ranges=[];
  let start=0;
  for(;;){
    if(heightRange(start, text.length) <= ch){
      ranges.push([start, text.length]);
      break;
    }
    const cut = fitCount(start, ch);
    ranges.push([start, start + cut]);
    start += cut;
    if(start >= text.length){
      ranges.push([start, start]);
      break;
    }
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
}
function ensureSizeMapLength(){
  while(sizeMap.length<text.length) sizeMap.push(size);
  if(sizeMap.length>text.length) sizeMap.length=text.length;
}
function ensureColorMapLength(){
  while(colorMap.length<text.length) colorMap.push(currentColor);
  if(colorMap.length>text.length) colorMap.length=text.length;
}
function rebuildLineHeightMap(){
  lineHeightMap = Array(text.length);
  let lineStart = 0;

  for(let i = 0; i <= text.length; i++){
    if(i === text.length || text[i] === "\n"){
      let largestSize = size;

      for(let j = lineStart; j < i; j++){
        largestSize = Math.max(largestSize, Number(sizeMap[j]) || size);
      }

      const lineHeight = Math.ceil(largestSize * 1.35);
      for(let j = lineStart; j < i; j++){
        lineHeightMap[j] = lineHeight;
      }
      if(i < text.length) lineHeightMap[i] = lineHeight;

      lineStart = i + 1;
    }
  }
}

function readPageStyles(el, defaultSize=size, defaultColor=currentColor){
  let out="";
  const sizes=[];
  const colors=[];
  function walk(node, inheritedSize, inheritedColor){
    if(!node) return;
    if(node.nodeType===3){
      const s=node.textContent||"";
      for(const ch of s){
        out+=ch;
        sizes.push(inheritedSize);
        colors.push(inheritedColor);
      }
      return;
    }
    if(node.nodeType!==1) return;
    if(node.tagName==="BR"){
      out+="\n";
      sizes.push(inheritedSize);
      colors.push(inheritedColor);
      return;
    }
    const isBlock = (node !== el && (node.tagName === "DIV" || node.tagName === "P"));
    if(isBlock && out.length > 0 && out[out.length - 1] !== "\n"){
      out+="\n";
      sizes.push(inheritedSize);
      colors.push(inheritedColor);
    }
    let nextSize=inheritedSize;
    let nextColor=inheritedColor;
    if(node.style && node.style.fontSize){
      const v=parseFloat(node.style.fontSize);
      if(!Number.isNaN(v)) nextSize=v;
    }
    if(node.style && node.style.color) nextColor=node.style.color;
    for(const child of node.childNodes) walk(child,nextSize,nextColor);
  }
  walk(el,defaultSize,defaultColor);
  return {text:out,sizes,colors};
}

function buildPageHtml(part, partSizes, partColors, partLineHeights){
  if(!part) return "";
  let html="";
  for(let i=0;i<part.length;i++){
    if(part[i]==="\n"){
      html+="<br>";
      continue;
    }

    const runSize=partSizes[i] ?? size;
    const runColor=partColors[i] ?? currentColor;
    const runLineHeight=partLineHeights[i] ?? Math.ceil(runSize * 1.35);

    let j=i+1;
    while(
      j<part.length &&
      part[j] !== "\n" &&
      (partSizes[j] ?? size) === runSize &&
      (partColors[j] ?? currentColor) === runColor &&
      (partLineHeights[j] ?? Math.ceil((partSizes[j] ?? size) * 1.35)) === runLineHeight
    ){
      j++;
    }

    html += '<span style="font-size:' + runSize + 'px; line-height:' + runLineHeight + 'px; color:' + escapeHtml(runColor) + ';">' + escapeHtml(part.slice(i,j)) + '</span>';
    i = j - 1;
  }
  return html;
}

function ensureSheets(n){
  const d=dims();
  while(sheets.length<n){
    const sh=document.createElement("div");
    sh.className="sheet";
    const ta=document.createElement("div");
    ta.className="page-edit";
    ta.contentEditable="true";
    ta.spellcheck=false;
    ta.setAttribute("aria-label","Page text");
    ta.addEventListener("input",()=>{
      const idx=tas.indexOf(ta);
      if(idx!==-1) onInput(idx);
    });
    ta.addEventListener("keydown",e=>{
      const idx=tas.indexOf(ta);
      if(idx!==-1) onKey(e,idx);
    });
    ta.addEventListener("focus",()=>{
      curPage=tas.indexOf(ta);
      updateStatus();
    });
    sh.appendChild(ta);
    pagesEl.appendChild(sh);
    sheets.push(sh);
    tas.push(ta);
  }
  while(sheets.length>n){
    const sh=sheets.pop();
    tas.pop();
    sh.remove();
  }
  sheets.forEach((sh,i)=>{
    sh.style.width=d.pw+"px";
    sh.style.height=d.ph+"px";
    sh.style.marginBottom=GAP+"px";
    const ta=tas[i];
    ta.style.left=M+"px";
    ta.style.top=M+"px";
    ta.style.width=d.cw+"px";
    ta.style.height=d.ch+"px";
    ta.style.fontFamily=FONTS[fontIdx][1];
    ta.style.fontSize=size+"px";
    ta.style.lineHeight=d.lh+"px";
  });
}

function layoutScale(){
  const d=dims();
  const avail=canvas.clientWidth-24;
  const s=Math.min(1,avail/d.pw);
  curScale=s;
  scaler.style.width=d.pw+"px";
  scaler.style.transform="scale("+s+")";
  scaler.style.marginBottom=(-(1-s)*(ranges.length*(d.ph+GAP)))+"px";
}

function fileName(){
  return ($("nameIn").value.trim()||"document");
}
function updateStatus(){
  const words=(text.match(/\S+/g)||[]).length;
  $("status").textContent="Page "+(Math.min(curPage,ranges.length-1)+1)+" of "+ranges.length+" \u00b7 "+words+" words"+(message?" \u00b7 "+message:"");
  document.title=(modified?"*":"")+fileName()+" - R-Writer";
}

function caretOffsetWithin(root,target,targetOffset){
  let offset=0;
  function walk(node){
    if(node===target){
      if(node.nodeType===3) return offset+Math.min(targetOffset,node.textContent.length);
      const children=Array.from(node.childNodes);
      for(let i=0;i<Math.min(targetOffset,children.length);i++){
        offset+=(children[i].nodeType===3 ? children[i].textContent.length : 1);
      }
      return offset;
    }
    if(node.nodeType===3){
      offset+=node.textContent.length;
      return null;
    }
    if(node.nodeType===1){
      if(node.tagName==="BR"){
        offset++;
        return null;
      }
      for(const child of node.childNodes){
        const result=walk(child);
        if(result!==null) return result;
      }
    }
    return null;
  }
  return walk(root);
}

function getLocalSelection(ta){
  const sel=window.getSelection();
  if(!sel || sel.rangeCount===0) return null;
  const r=sel.getRangeAt(0);
  if(!ta.contains(r.startContainer) || !ta.contains(r.endContainer)) return null;
  const start=caretOffsetWithin(ta,r.startContainer,r.startOffset);
  const end=caretOffsetWithin(ta,r.endContainer,r.endOffset);
  if(start===null || end===null) return null;
  return { start: Math.min(start, end), end: Math.max(start, end) };
}

function currentCaretPosition(){
  const sel=window.getSelection();
  if(!sel || sel.rangeCount===0) return savedCaret;
  for(let i=0;i<tas.length;i++){
    const editor=tas[i];
    if(!editor.contains(sel.anchorNode)) continue;
    const local=caretOffsetWithin(editor,sel.anchorNode,sel.anchorOffset);
    if(local!==null){
      savedCaret=ranges[i][0]+local;
      return savedCaret;
    }
  }
  return savedCaret;
}

function setCaretWithin(root,wantedOffset){
  const range=document.createRange();
  let offset=0;
  let placed=false;
  function walk(node){
    if(placed) return;
    if(node.nodeType===3){
      const len=node.textContent.length;
      if(wantedOffset<=offset+len){
        range.setStart(node,Math.max(0,wantedOffset-offset));
        placed=true;
      }else offset+=len;
      return;
    }
    if(node.nodeType===1){
      if(node.tagName==="BR"){
        if(wantedOffset<=offset){
          range.setStartBefore(node);
          placed=true;
        }else if(wantedOffset<=offset+1){
          range.setStartAfter(node);
          placed=true;
        }else offset++;
        return;
      }
      for(const child of node.childNodes){
        walk(child);
        if(placed) return;
      }
    }
  }
  for(const child of root.childNodes){
    walk(child);
    if(placed) break;
  }
  if(!placed){
    range.selectNodeContents(root);
    range.collapse(false);
  }else range.collapse(true);

  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function render(){
  ensureSizeMapLength();
  ensureColorMapLength();
  rebuildLineHeightMap();
  paginate();
  ensureSheets(ranges.length);

  ranges.forEach(([s,e],i)=>{
    const html = buildPageHtml(
      text.slice(s,e),
      sizeMap.slice(s,e),
      colorMap.slice(s,e),
      lineHeightMap.slice(s,e)
    );
    if(tas[i].innerHTML !== html) tas[i].innerHTML = html;
  });

  layoutScale();

  if(pending){
    const g=Math.min(pending.g,text.length);
    let p=ranges.findIndex(([s,e])=>g>=s&&g<e);
    if(p<0) p=ranges.length-1;
    if(pending.prefer!=null && pending.prefer<ranges.length &&
       g>=ranges[pending.prefer][0] && g<=ranges[pending.prefer][1]) p=pending.prefer;
    const [ps, pe] = ranges[p];
    const local = g - ps;
    pending=null;

    const ta=tas[p];
    ta.focus();
    curPage=p;
    const d=dims();
    const lhs=(lineHeightMap[g] || d.lh)*curScale;
    const y=ta.getBoundingClientRect().top + (rowOfRange(ps, ps + local) + 1) * lhs;
    const barH=document.querySelector(".top").offsetHeight;
    const stH=$("status").offsetHeight;

    setCaretWithin(ta, Math.max(0, Math.min(local, pe - ps)));
    savedCaret=g;

    if(y-lhs<barH+8) window.scrollBy(0,y-lhs-barH-40);
    else if(y>innerHeight-stH-8) window.scrollBy(0,y-innerHeight+stH+40);
  }

  updateStatus();
}

function onInput(i){
  const [s,e]=ranges[i];
  const caretBefore=currentCaretPosition();
  const oldText=text.slice(s,e);
  const oldSizes=sizeMap.slice(s,e);
  const oldColors=colorMap.slice(s,e);
  const parsed=readPageStyles(tas[i], size, currentColor);
  const pageText=parsed.text;
  const pageSizes=parsed.sizes;
  const pageColors=parsed.colors;

  let prefix=0;
  while(prefix<oldText.length && prefix<pageText.length && oldText[prefix]===pageText[prefix]) prefix++;

  let suffix=0;
  while(suffix<oldText.length-prefix && suffix<pageText.length-prefix &&
        oldText[oldText.length-1-suffix]===pageText[pageText.length-1-suffix]) suffix++;

  for(let j=0;j<prefix;j++){
    pageSizes[j]=oldSizes[j] ?? size;
    pageColors[j]=oldColors[j] ?? currentColor;
  }
  for(let j=0;j<suffix;j++){
    pageSizes[pageText.length-1-j]=oldSizes[oldText.length-1-j] ?? size;
    pageColors[pageText.length-1-j]=oldColors[oldText.length-1-j] ?? currentColor;
  }

  for(let j=prefix;j<pageText.length-suffix;j++){
    pageSizes[j]=size;
    pageColors[j]=currentColor;
  }

  text=text.slice(0,s)+pageText+text.slice(e);
  sizeMap=sizeMap.slice(0,s).concat(pageSizes,sizeMap.slice(e));
  colorMap=colorMap.slice(0,s).concat(pageColors,colorMap.slice(e));
  ensureSizeMapLength();
  ensureColorMapLength();

  modified=true;

  const targetCaret = caretBefore != null ? caretBefore : s + pageText.length;
  pending={g:targetCaret, prefer:i};
  render();
}

function onKey(ev,i){
  if(ev.ctrlKey||ev.metaKey||ev.altKey||ev.shiftKey) return;
  const ta=tas[i];
  const sel=getLocalSelection(ta);
  if(!sel) return;

  const [s,e]=ranges[i];
  const local=sel.start;
  const collapsed=(sel.start===sel.end);
  const pageLen=e-s;
  const n=ranges.length;
  const go=(g, prefer=null)=>{ ev.preventDefault(); pending={g, prefer}; render(); };

  switch(ev.key){
    case "Enter": {
      ev.preventDefault();
      const gStart = s + sel.start;
      const gEnd = s + sel.end;
      text = text.slice(0, gStart) + "\n" + text.slice(gEnd);
      sizeMap.splice(gStart, gEnd - gStart, size);
      colorMap.splice(gStart, gEnd - gStart, currentColor);
      modified = true;
      pending = { g: gStart + 1, prefer: i };
      render();
      break;
    }
    case "Backspace":
      if(collapsed && local===0 && i>0){
        ev.preventDefault();
        text=text.slice(0,s-1)+text.slice(s);
        sizeMap.splice(s-1,1);
        colorMap.splice(s-1,1);
        modified=true;
        pending={g:s-1};
        render();
      }
      break;
    case "Delete":
      if(collapsed && local===pageLen && e<text.length){
        ev.preventDefault();
        text=text.slice(0,e)+text.slice(e+1);
        sizeMap.splice(e,1);
        colorMap.splice(e,1);
        modified=true;
        pending={g:e};
        render();
      }
      break;
    case "ArrowLeft":
      if(collapsed && local===0 && i>0) go(s-1, i-1);
      break;
    case "ArrowRight":
      if(collapsed && local===pageLen && i<n-1) go(Math.min(e+1,text.length), i+1);
      break;
    case "ArrowUp":
      if(collapsed && i>0 && rowOfRange(s, s+local)===0){
        const col=local;
        const [ps,pe]=ranges[i-1];
        const pv=text.slice(ps,pe);
        const rs=rowStart(ps, pv.length);
        let len=pv.length-rs;
        if(pv.endsWith("\n")) len=Math.max(len-1,0);
        go(ps+rs+Math.min(col,len), i-1);
      }
      break;
    case "ArrowDown":
      if(collapsed && i<n-1 && rowOfRange(s, s+local)===rowOfRange(s, e)){
        const col=local-rowStart(s, local);
        const [ns,ne]=ranges[i+1];
        const nv=text.slice(ns,ne);
        let k=0;
        while(k<nv.length && rowOfRange(ns, ns+k+1)<1 && nv[k]!=="\n") k++;
        go(ns+Math.min(col,k), i+1);
      }
      break;
  }
}

/* ---------- file formats ---------- */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function colorToHex(color){
  if(/^#[0-9a-f]{6}$/i.test(color)) return color.slice(1).toUpperCase();
  const match=color.match(/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
  if(match) return match.slice(1,4).map(n=>Number(n).toString(16).padStart(2,"0")).join("").toUpperCase();
  return "111111";
}

function docxText(xml){
  const d=new DOMParser().parseFromString(xml,"application/xml");
  if(d.getElementsByTagName("parsererror").length) throw new Error("could not read document.xml");
  const out=[];
  for(const p of d.getElementsByTagName("w:p")){
    let s="";
    (function walk(n){
      for(const c of n.childNodes){
        if(c.nodeType!==1) continue;
        const nm=c.nodeName;
        if(nm==="w:t") s+=c.textContent;
        else if(nm==="w:tab") s+="\t";
        else if(nm==="w:br"||nm==="w:cr") s+="\n";
        else if(nm!=="w:p") walk(c);
      }
    })(p);
    out.push(s);
  }
  return out.join("\n");
}

function odtText(xml){
  const d=new DOMParser().parseFromString(xml,"application/xml");
  if(d.getElementsByTagName("parsererror").length) throw new Error("could not read content.xml");
  const out=[];
  function walk(n,st){
    for(const c of n.childNodes){
      if(c.nodeType===3){ st.s+=c.textContent; continue; }
      if(c.nodeType!==1) continue;
      const nm=c.nodeName;
      if(nm==="text:s") st.s+=" ".repeat(parseInt(c.getAttribute("text:c")||"1",10));
      else if(nm==="text:tab") st.s+="\t";
      else if(nm==="text:line-break") st.s+="\n";
      else if(nm!=="office:annotation") walk(c,st);
    }
  }
  (function find(n){
    for(const c of n.childNodes){
      if(c.nodeType!==1) continue;
      if(c.nodeName==="text:p"||c.nodeName==="text:h"){
        const st={s:""};
        walk(c,st);
        out.push(st.s);
      }else if(c.nodeName!=="office:annotation") find(c);
    }
  })(d.documentElement);
  return out.join("\n");
}

async function buildDocx(){
  const [w,h]=TWIPS[pageKey];
  const font=esc(FONTS[fontIdx][2]);
  let body="";
  let pos=0;

  for(const line of text.split("\n")){
    body+="<w:p>";
    let i=0;
    while(i<line.length){
      if(line[i]==="\t"){
        body+="<w:r><w:tab/></w:r>";
        i++;
        pos++;
        continue;
      }
      const runColor=colorMap[pos] ?? currentColor;
      const runSize=sizeMap[pos] ?? size;
      let j=i+1;
      while(j<line.length && line[j]!=="\t" &&
            (colorMap[pos+(j-i)] ?? currentColor)===runColor &&
            (sizeMap[pos+(j-i)] ?? size)===runSize) j++;
      const half=Math.round(runSize*0.75*2);
      body+='<w:r><w:rPr><w:rFonts w:ascii="'+font+'" w:hAnsi="'+font+'"/><w:sz w:val="'+half+'"/><w:color w:val="'+colorToHex(runColor)+'"/></w:rPr><w:t xml:space="preserve">'+esc(line.slice(i,j))+'</w:t></w:r>';
      pos += j-i;
      i=j;
    }
    body += "</w:p>";
    pos++;
  }

  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="'+w+'" w:h="'+h+'"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

function odtLine(line){
  let out="", sp=0;
  const flush=()=>{
    if(sp>0){
      out+=" ";
      if(sp>1) out+='<text:s text:c="'+(sp-1)+'"/>';
      sp=0;
    }
  };
  for(const ch of line){
    if(ch===" ") sp++;
    else if(ch==="\t"){ flush(); out+="<text:tab/>"; }
    else { flush(); out+=esc(ch); }
  }
  flush();
  return out;
}

async function buildOdt(){
  const body=text.split("\n").map(line=>'<text:p text:style-name="P1">'+odtLine(line)+'</text:p>').join("");
  const zip=new JSZip();
  zip.file("mimetype","application/vnd.oasis.opendocument.text",{compression:"STORE"});
  zip.file("META-INF/manifest.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:media-type="application/vnd.oasis.opendocument.text" manifest:full-path="/"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="content.xml"/></manifest:manifest>');
  zip.file("styles.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" office:version="1.2"><office:automatic-styles/><office:master-styles/></office:document-styles>');
  zip.file("content.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" office:version="1.2"><office:automatic-styles><style:style style:name="P1" style:family="paragraph"><style:paragraph-properties fo:margin-top="0cm" fo:margin-bottom="0cm"/></style:style></office:automatic-styles><office:body><office:text>'+body+'</office:text></office:body></office:document-content>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

/* ---------- toolbar actions ---------- */
let afterAsk=null;
function guard(fn){
  if(!modified){ fn(); return; }
  afterAsk=fn;
  $("ask").style.display="flex";
}
$("askYes").onclick=()=>{
  $("ask").style.display="none";
  const f=afterAsk;
  afterAsk=null;
  if(f) f();
};
$("askNo").onclick=()=>{
  $("ask").style.display="none";
  afterAsk=null;
};

function openDlg(){
  $("fileIn").value="";
  $("fileIn").click();
}

$("fileIn").addEventListener("change", async e=>{
  const f=e.target.files[0];
  if(!f) return;
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    let t;
    if(ext==="txt") t=await f.text();
    else{
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      if(ext==="docx") t=docxText(await z.file("word/document.xml").async("string"));
      else if(ext==="odt") t=odtText(await z.file("content.xml").async("string"));
      else throw new Error("use a .docx, .odt or .txt file");
    }
    text=t;
    sizeMap=Array(text.length).fill(size);
    colorMap=Array(text.length).fill(currentColor);
    modified=false;
    message="Opened "+f.name;
    $("nameIn").value=f.name.replace(/\.[^.]+$/,"");
    pending={g:0};
    render();
  }catch(err){
    message="Open failed: "+(err&&err.message?err.message:err);
    updateStatus();
  }
});

function triggerDownload(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function save(fmt){
  try{
    let blob,fname;
    if(fmt==="odt"){
      blob=await buildOdt();
      fname=fileName()+".odt";
    }else if(fmt==="txt"){
      blob=new Blob([text],{type:"text/plain;charset=utf-8"});
      fname=fileName()+".txt";
    }else{
      blob=await buildDocx();
      fname=fileName()+".docx";
    }
    triggerDownload(blob,fname);
    modified=false;
    message="Saved "+fname;
  }catch(err){
    message="Save failed: "+(err&&err.message?err.message:err);
  }
  updateStatus();
}

function showSave(){ $("saveDlg").style.display="flex"; }
$("dlgCancel").onclick=()=>{ $("saveDlg").style.display="none"; };
$("dlgSave").onclick=()=>{
  $("saveDlg").style.display="none";
  const f=document.querySelector('input[name="fmt"]:checked').value;
  save(f);
};
$("openBtn").onclick=()=>guard(openDlg);
$("saveBtn").onclick=showSave;
$("nameIn").addEventListener("input",updateStatus);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("saveDlg").style.display="none";
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==="s"){ e.preventDefault(); showSave(); }
  else if(k==="o"){ e.preventDefault(); guard(openDlg); }
});

$("pageSel").addEventListener("change",e=>{ pageKey=e.target.value; keep(); });
$("fontSel").addEventListener("change",e=>{ fontIdx=+e.target.value; keep(); });

$("colorSel").addEventListener("input",e=>{
  currentColor=e.target.value;
  const sel=window.getSelection();
  if(sel && sel.rangeCount>0 && !sel.isCollapsed){
    for(let i=0; i<tas.length; i++){
      const ta=tas[i];
      const localSel=getLocalSelection(ta);
      if(localSel){
        const [s,e]=ranges[i];
        const startG=s+localSel.start;
        const endG=s+localSel.end;
        for(let idx=startG; idx<endG; idx++){
          colorMap[idx]=currentColor;
        }
        modified=true;
        render();
        return;
      }
    }
  }
  const caret = currentCaretPosition();
  if(caret != null && caret < colorMap.length){
    colorMap[caret] = currentColor;
  }
  modified = true;
});

$("sizeIn").addEventListener("input",e=>{
  const v=Math.max(8,Math.min(48,+e.target.value||14));
  size=v;
  keep();
});

function keep(){
  const caret=currentCaretPosition();
  const g=caret!=null ? caret :
    (tas[curPage] ? ranges[curPage][0]+(tas[curPage].innerText||tas[curPage].textContent||"").length : 0);
  pending={g,prefer:curPage};
  render();
}

window.addEventListener("resize",layoutScale);
window.addEventListener("beforeunload",e=>{
  if(modified){
    e.preventDefault();
    e.returnValue="";
  }
});

sizeMap=Array(text.length).fill(size);
colorMap=Array(text.length).fill(currentColor);
render();
tas[0].focus();
</script>
</body>
