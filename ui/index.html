<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Writer</title>
<style>
:root{
  --bar:#ffffff; --fg:#1b1b1b; --mut:#5f5f5f; --bd:#d4d4d0; --ctl:#f1f1ee; --canvas:#6a6a6a; --warn:#fff4d6; --warnfg:#5c4300;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
}
:root[data-theme="dark"]{ --bar:#252525; --fg:#e8e8e8; --mut:#a8a8a8; --bd:#3a3a3a; --ctl:#383838; --canvas:#5a5a5a; --warn:#4a3a10; --warnfg:#ffe9a8; }
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); scroll-padding-bottom:50px;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bar); z-index:30;}
body{margin:0; background:var(--canvas); color:var(--fg); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bar); border-bottom:1px solid var(--bd);}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px;}
.bar select,.bar input[type=number],.bar input[type=text],.bar button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 10px; font:inherit;}
.bar button{cursor:pointer;}
.bar button:hover{border-color:var(--mut);}
.bar input[type=number]{width:60px;}
.bar input[type=text]{width:130px;}
.bar label{color:var(--mut); font-size:13px;}
.sep{width:1px; height:20px; background:var(--bd);}
#ask{display:none; align-items:center; gap:8px; padding:6px 12px; background:var(--warn); color:var(--warnfg); font-size:13px; border-top:1px solid var(--bd);}
#ask button{background:transparent; color:inherit; border:1px solid currentColor; border-radius:6px; padding:3px 10px; font:inherit; cursor:pointer;}
.dlg{background:var(--bar); color:var(--fg); border:1px solid var(--bd); border-radius:12px; padding:16px 20px; min-width:280px; max-width:90vw; display:flex; flex-direction:column; gap:10px;}
.dlg h2{margin:0; font-size:16px; font-weight:500;}
.dlg label{display:flex; align-items:center; gap:8px; cursor:pointer;}
.dlg small{color:var(--mut);}
.dlg .row{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
.dlg button{background:var(--ctl); color:var(--fg); border:1px solid var(--bd); border-radius:6px; padding:5px 14px; font:inherit; cursor:pointer;}
#canvas{flex:1; background:var(--canvas); padding:20px 0 40px;}
#scaler{margin:0 auto; transform-origin:top center;}
.sheet{position:relative; background:#fff; border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.35);}
.sheet .page-edit{scroll-margin:90px 0 50px; position:absolute; border:0; outline:0; resize:none; overflow:hidden; background:transparent; color:#111; padding:0; margin:0; white-space:pre-wrap; word-wrap:break-word; tab-size:4;}
.status{position:sticky; bottom:env(safe-area-inset-bottom,0px); z-index:20; padding:6px 12px; border-top:1px solid var(--bd); color:var(--mut); font-size:13px; background:var(--bar);}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <button id="openBtn" title="Ctrl+O">Open&hellip;</button>
      <button id="saveBtn" title="Ctrl+S">Save</button>
      <label>Name <input id="nameIn" type="text" value="document" aria-label="File name"></label>
      <span class="sep"></span>
      <select id="pageSel" aria-label="Page size"><option value="A4">A4</option><option value="Letter">Letter</option></select>
      <select id="fontSel" aria-label="Font"></select>
      <label>Size <input id="sizeIn" type="number" min="8" max="48" value="14"> px</label>
    </div>
    <div id="ask"><span>Discard your unsaved changes?</span><button id="askYes">Discard</button><button id="askNo">Cancel</button></div>
  </div>
  <input id="fileIn" type="file" accept=".docx,.odt,.txt" hidden>
  <div id="saveDlg" style="display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); align-items:center; justify-content:center;">
    <div class="dlg" role="dialog" aria-label="Save document">
      <h2>Save document</h2>
      <label><input type="radio" name="fmt" value="docx" checked> Word document (.docx)</label>
      <label><input type="radio" name="fmt" value="odt"> OpenDocument text (.odt)</label>
      <label><input type="radio" name="fmt" value="txt"> Plain text (.txt)</label>
      <div class="row"><button id="dlgCancel">Cancel</button><button id="dlgSave">Save</button></div>
    </div>
  </div>
  <div id="canvas"><div id="scaler"><div id="pages"></div></div></div>
  <div class="status" id="status"></div>
</div>
<script src="jszip.min.js"></script>
<script>
const FONTS = [
  ["Ubuntu Light (default sans)", "Ubuntu, 'Segoe UI', system-ui, sans-serif", "Ubuntu"],
  ["Hack (default mono)", "Hack, 'DejaVu Sans Mono', Menlo, monospace", "Hack"],
  ["Liberation Serif (Times-like)", "'Liberation Serif','Times New Roman',Times,serif", "Liberation Serif"],
  ["Liberation Sans (Arial-like)", "'Liberation Sans',Arial,Helvetica,sans-serif", "Liberation Sans"],
  ["Liberation Mono (Courier-like)", "'Liberation Mono','Courier New',monospace", "Liberation Mono"],
  ["Carlito (Calibri-like)", "Carlito,Calibri,sans-serif", "Carlito"],
  ["Caladea (Cambria-like)", "Caladea,Cambria,serif", "Caladea"],
  ["DejaVu Sans", "'DejaVu Sans',Verdana,sans-serif", "DejaVu Sans"],
  ["DejaVu Serif", "'DejaVu Serif',Georgia,serif", "DejaVu Serif"]
];
const SIZES = { A4:[794,1123], Letter:[816,1056] };
const TWIPS = { A4:[11906,16838], Letter:[12240,15840] };
const M = 48, GAP = 24;

let text = "", pageKey = "A4", fontIdx = 2, size = 14;
let ranges = [[0,0]], pending = null, curPage = 0, curScale = 1;
let tas = [], sheets = [], sizeMap = [];
let modified = false, message = "";

const $ = id => document.getElementById(id);
const pagesEl = $("pages"), scaler = $("scaler"), canvas = $("canvas");

const meas = document.createElement("div");
meas.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;padding:0;margin:0;border:0;box-sizing:content-box;";
document.body.appendChild(meas);

FONTS.forEach((f,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=f[0]; $("fontSel").appendChild(o); });
$("fontSel").value = fontIdx;

function dims(){ const [pw,ph]=SIZES[pageKey]; return {pw, ph, cw:pw-2*M, ch:ph-2*M, lh:Math.round(size*1.35)}; }
function applyMeas(){ const d=dims(); meas.style.width=d.cw+"px"; meas.style.fontFamily=FONTS[fontIdx][1]; meas.style.fontSize=size+"px"; meas.style.lineHeight=d.lh+"px"; }
function height(str){ meas.textContent = str + "\u200b"; return meas.offsetHeight; }
function rowOf(str, off){ return Math.round(height(str.slice(0,off))/dims().lh) - 1; }
function rowStart(str, off){ const r=rowOf(str,off); let lo=0, hi=off; while(lo<hi){ const mid=(lo+hi)>>1; if(rowOf(str,mid)>=r) hi=mid; else lo=mid+1; } return lo; }

function fitCount(str, maxH){
  let lo=0, hi=str.length;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(height(str.slice(0,mid))<=maxH) lo=mid; else hi=mid-1; }
  let k=Math.max(lo,1);
  if(k<str.length && !/\s/.test(str[k-1]) && !/\s/.test(str[k])){
    for(let j=k-1;j>0;j--){ if(/\s/.test(str[j-1])){ k=j; break; } }
  }
  return k;
}

function paginate(){
  applyMeas();
  const {ch}=dims();
  ranges=[]; let start=0;
  for(;;){
    const rest=text.slice(start);
    if(height(rest)<=ch){ ranges.push([start,text.length]); break; }
    const cut=fitCount(rest,ch);
    ranges.push([start,start+cut]); start+=cut;
    if(start>=text.length){ ranges.push([start,start]); break; }
  }
}

function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); }

function ensureSizeMapLength(){
  while(sizeMap.length < text.length) sizeMap.push(size);
  if(sizeMap.length > text.length) sizeMap.length = text.length;
}

function readPageSizes(el, defaultSize = size){
  let out = "";
  let sizes = [];
  function walk(node, inheritedSize){
    if(!node) return;
    if(node.nodeType === 3){
      const s=node.textContent || "";
      for(const ch of s){ out += ch; sizes.push(inheritedSize); }
      return;
    }
    if(node.nodeType !== 1) return;
    if(node.tagName === "BR"){
      out += "\n"; sizes.push(inheritedSize);
      return;
    }
    let nextSize = inheritedSize;
    if(node.style && node.style.fontSize){
      const v=parseFloat(node.style.fontSize);
      if(!Number.isNaN(v)) nextSize = v;
    }
    for(const child of node.childNodes){ walk(child, nextSize); }
  }
  walk(el, defaultSize);
  return {text:out, sizes};
}

function buildPageHtml(part, partSizes){
  if(!part) return "";
  let html = "";
  for(let i=0;i<part.length;i++){
    const ch = part[i];
    if(ch === "\n") { html += "<br>"; continue; }
    const current = partSizes[i] ?? size;
    let j = i + 1;
    while(j < part.length && part[j] !== "\n" && (partSizes[j] ?? size) === current){ j++; }
    html += '<span style="font-size:' + current + 'px;">' + escapeHtml(part.slice(i, j)) + '</span>';
    i = j - 1;
  }
  return html;
}

function ensureSheets(n){
  const d=dims();
  while(sheets.length<n){
    const sh=document.createElement("div"); sh.className="sheet";
    const ta=document.createElement("div"); ta.className="page-edit"; ta.contentEditable="true"; ta.spellcheck=false; ta.setAttribute("aria-label","Page text");
    const idx=sheets.length;
    ta.addEventListener("input",()=>onInput(idx));
    ta.addEventListener("keydown",e=>onKey(e,idx));
    ta.addEventListener("focus",()=>{ curPage=tas.indexOf(ta); updateStatus(); });
    sh.appendChild(ta); pagesEl.appendChild(sh); sheets.push(sh); tas.push(ta);
  }
  while(sheets.length>n){ const sh=sheets.pop(); tas.pop(); sh.remove(); }
  sheets.forEach((sh,i)=>{
    sh.style.width=d.pw+"px"; sh.style.height=d.ph+"px"; sh.style.marginBottom=GAP+"px";
    const ta=tas[i];
    ta.style.left=M+"px"; ta.style.top=M+"px"; ta.style.width=d.cw+"px"; ta.style.height=d.ch+"px";
    ta.style.fontFamily=FONTS[fontIdx][1]; ta.style.lineHeight=d.lh+"px";
  });
}

function layoutScale(){
  const d=dims(); const avail=canvas.clientWidth-24;
  const s=Math.min(1,avail/d.pw); curScale=s;
  scaler.style.width=d.pw+"px"; scaler.style.transform="scale("+s+")";
  scaler.style.marginBottom=(-(1-s)*(ranges.length*(d.ph+GAP)))+"px";
}

function fileName(){ return ($("nameIn").value.trim()||"document"); }
function updateStatus(){
  const words=(text.match(/\S+/g)||[]).length;
  $("status").textContent="Page "+(Math.min(curPage,ranges.length-1)+1)+" of "+ranges.length+" \u00b7 "+words+" words"+(message?" \u00b7 "+message:"");
  document.title=(modified?"*":"")+fileName()+" - R-Writer";
}

function rebuildDocumentFromPages(){
  let nextText = "";
  let nextSizes = [];
  for(const ta of tas){
    const parsed = readPageSizes(ta, size);
    nextText += parsed.text;
    nextSizes.push(...parsed.sizes);
  }
  text = nextText;
  sizeMap = nextSizes;
  ensureSizeMapLength();
}

function render(){
  paginate(); ensureSheets(ranges.length);
  ranges.forEach(([s,e],i)=>{
    const part = text.slice(s,e);
    const partSizes = sizeMap.slice(s,e);
    const html = buildPageHtml(part, partSizes);
    if(tas[i].innerHTML !== html) tas[i].innerHTML = html;
  });
  layoutScale();
  if(pending){
    const g=Math.min(pending.g,text.length);
    let p=ranges.findIndex(([s,e])=>g>=s&&g<e); if(p<0) p=ranges.length-1;
    if(pending.prefer!=null && pending.prefer<ranges.length && g>=ranges[pending.prefer][0] && g<=ranges[pending.prefer][1]) p=pending.prefer;
    const local=g-ranges[p][0];
    pending=null;
    tas[p].focus();
    curPage=p;
    const ta=tas[p];
    const d=dims(); const lhs=d.lh*curScale;
    const y=ta.getBoundingClientRect().top+(rowOf(ta.innerText || ta.textContent, local)+1)*lhs;
    const barH=document.querySelector(".top").offsetHeight, stH=$("status").offsetHeight;
    if(y-lhs<barH+8) window.scrollBy(0,y-lhs-barH-40);
    else if(y>innerHeight-stH-8) window.scrollBy(0,y-innerHeight+stH+40);
  }
  updateStatus();
}

function onInput(i){
  const [s,e]=ranges[i];
  const parsed = readPageSizes(tas[i], size);
  const pageText = parsed.text;
  const pageSizes = parsed.sizes;
  text = text.slice(0,s) + pageText + text.slice(e);
  const before = sizeMap.slice(0,s);
  const after = sizeMap.slice(e);
  sizeMap = before.concat(pageSizes, after);
  ensureSizeMapLength();
  modified = true;
  pending={g:s+pageText.length, prefer:i};
  render();
}

function onKey(ev,i){
  if(ev.ctrlKey||ev.metaKey||ev.altKey||ev.shiftKey) return;
  const ta=tas[i];
  if(typeof ta.selectionStart === "number" && typeof ta.selectionEnd === "number"){
    const [s,e]=ranges[i]; const local=ta.selectionStart; const v=ta.value; const n=ranges.length;
    const go=g=>{ ev.preventDefault(); pending={g}; render(); };
    switch(ev.key){
      case "Backspace":
        if(local===0 && i>0){ ev.preventDefault(); text=text.slice(0,s-1)+text.slice(s); modified=true; pending={g:s-1}; render(); }
        break;
      case "Delete":
        if(local===v.length && e<text.length){ ev.preventDefault(); text=text.slice(0,e)+text.slice(e+1); modified=true; pending={g:e}; render(); }
        break;
      case "ArrowLeft": if(local===0 && i>0) go(s-1); break;
      case "ArrowRight": if(local===v.length && i<n-1) go(Math.min(e+1,text.length)); break;
      case "ArrowUp":
        if(i>0 && rowOf(v,local)===0){
          const col=local; const [ps,pe]=ranges[i-1]; const pv=text.slice(ps,pe);
          const rs=rowStart(pv,pv.length); let len=pv.length-rs; if(pv.endsWith("\n")) len=Math.max(len-1,0);
          go(ps+rs+Math.min(col,len));
        } break;
      case "ArrowDown":
        if(i<n-1 && rowOf(v,local)===rowOf(v,v.length)){
          const col=local-rowStart(v,local); const [ns,ne]=ranges[i+1]; const nv=text.slice(ns,ne);
          let k=0; while(k<nv.length && rowOf(nv,k+1)<1 && nv[k]!="\n") k++;
          go(ns+Math.min(col,k));
        } break;
    }
  }
}

/* ---------- file formats ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function docxText(xml){
  const d=new DOMParser().parseFromString(xml,"application/xml");
  if(d.getElementsByTagName("parsererror").length) throw new Error("could not read document.xml");
  const out=[];
  for(const p of d.getElementsByTagName("w:p")){
    let s="";
    (function walk(n){ for(const c of n.childNodes){
      if(c.nodeType!==1) continue;
      const nm=c.nodeName;
      if(nm==="w:t") s+=c.textContent;
      else if(nm==="w:tab") s+="\t";
      else if(nm==="w:br"||nm==="w:cr") s+="\n";
      else if(nm!=="w:p") walk(c);
    }})(p);
    out.push(s);
  }
  return out.join("\n");
}

function odtText(xml){
  const d=new DOMParser().parseFromString(xml,"application/xml");
  if(d.getElementsByTagName("parsererror").length) throw new Error("could not read content.xml");
  const out=[];
  function walk(n,st){ for(const c of n.childNodes){
    if(c.nodeType===3){ st.s+=c.textContent; continue; }
    if(c.nodeType!==1) continue;
    const nm=c.nodeName;
    if(nm==="text:s") st.s+=" ".repeat(parseInt(c.getAttribute("text:c")||"1",10));
    else if(nm==="text:tab") st.s+="\t";
    else if(nm==="text:line-break") st.s+="\n";
    else if(nm!=="office:annotation") walk(c,st);
  }}
  (function find(n){ for(const c of n.childNodes){
    if(c.nodeType!==1) continue;
    if(c.nodeName==="text:p"||c.nodeName==="text:h"){ const st={s:""}; walk(c,st); out.push(st.s); }
    else if(c.nodeName!=="office:annotation") find(c);
  }})(d.documentElement);
  return out.join("\n");
}

async function buildDocx(){
  const [w,h]=TWIPS[pageKey]; const font=esc(FONTS[fontIdx][2]); const half=Math.round(size*0.75*2);
  let body="";
  for(const line of text.split("\n")){
    body+="<w:p>";
    line.split("\t").forEach((seg,k)=>{
      if(k>0) body+="<w:r><w:tab/></w:r>";
      body+='<w:r><w:rPr><w:rFonts w:ascii="'+font+'" w:hAnsi="'+font+'"/><w:sz w:val="'+half+'"/></w:rPr><w:t xml:space="preserve">'+esc(seg)+'</w:t></w:r>';
    });
    body+="</w:p>";
  }
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="'+w+'" w:h="'+h+'"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

function odtLine(line){
  let out="", sp=0;
  const flush=()=>{ if(sp>0){ out+=" "; if(sp>1) out+='<text:s text:c="'+(sp-1)+'"/>'; sp=0; } };
  for(const ch of line){
    if(ch===" ") sp++;
    else if(ch==="\t"){ flush(); out+="<text:tab/>"; }
    else { flush(); out+=esc(ch); }
  }
  flush(); return out;
}

async function buildOdt(){
  const font=esc(FONTS[fontIdx][2]);
  const body=text.split("\n").map(l=>'<text:p text:style-name="P1">'+odtLine(l)+'</text:p>').join("");
  const zip=new JSZip();
  zip.file("mimetype","application/vnd.oasis.opendocument.text",{compression:"STORE"});
  zip.file("META-INF/manifest.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:media-type="application/vnd.oasis.opendocument.text" manifest:full-path="/"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="content.xml"/></manifest:manifest>');
  zip.file("styles.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles/><office:master-styles/></office:document-styles>');
  zip.file("content.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles><style:style style:name="P1" style:family="paragraph"><style:paragraph-properties fo:margin-top="0cm" fo:margin-bottom="0cm"/></style:style></office:automatic-styles><office:body><office:text>'+body+'</office:text></office:body></office:document-content>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

/* ---------- toolbar actions ---------- */
let afterAsk=null;
function guard(fn){ if(!modified){ fn(); return; } afterAsk=fn; $("ask").style.display="flex"; }
$("askYes").onclick=()=>{ $("ask").style.display="none"; const f=afterAsk; afterAsk=null; if(f) f(); };
$("askNo").onclick=()=>{ $("ask").style.display="none"; afterAsk=null; };

function openDlg(){ $("fileIn").value=""; $("fileIn").click(); }

$("fileIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    let t;
    if(ext==="txt") t=await f.text();
    else{
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      if(ext==="docx") t=docxText(await z.file("word/document.xml").async("string"));
      else if(ext==="odt") t=odtText(await z.file("content.xml").async("string"));
      else throw new Error("use a .docx, .odt or .txt file");
    }
    text=t; sizeMap=Array(text.length).fill(size); modified=false; message="Opened "+f.name;
    $("nameIn").value=f.name.replace(/\.[^.]+$/,"" );
    pending={g:0}; render();
  }catch(err){ message="Open failed: "+(err&&err.message?err.message:err); updateStatus(); }
});

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function save(fmt){
  try{
    let blob, fname;
    if(fmt === "odt"){
      blob = await buildOdt();
      fname = fileName() + ".odt";
    } else if(fmt === "txt"){
      blob = new Blob([text], {type: "text/plain;charset=utf-8"});
      fname = fileName() + ".txt";
    } else {
      blob = await buildDocx();
      fname = fileName() + ".docx";
    }
    triggerDownload(blob, fname);
    modified = false;
    message = "Saved " + fname;
  }catch(err){
    message = "Save failed: " + (err && err.message ? err.message : err);
  }
  updateStatus();
}

function showSave(){ $("saveDlg").style.display="flex"; }
$("dlgCancel").onclick=()=>{ $("saveDlg").style.display="none"; };
$("dlgSave").onclick=()=>{ $("saveDlg").style.display="none"; const f=document.querySelector('input[name="fmt"]:checked').value; save(f); };
$("openBtn").onclick=()=>guard(openDlg);
$("saveBtn").onclick=showSave;
$("nameIn").addEventListener("input",updateStatus);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("saveDlg").style.display="none";
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==="s"){ e.preventDefault(); showSave(); }
  else if(k==="o"){ e.preventDefault(); guard(openDlg); }
});

$("pageSel").addEventListener("change",e=>{ pageKey=e.target.value; keep(); });
$("fontSel").addEventListener("change",e=>{ fontIdx=+e.target.value; keep(); });
$("sizeIn").addEventListener("input",e=>{ const v=Math.max(8,Math.min(48,+e.target.value||14)); size=v; keep(); });
function keep(){
  const g=tas[curPage] ? ranges[curPage][0] + (tas[curPage].innerText || tas[curPage].textContent || "").length : 0;
  pending={g, prefer:curPage};
  render();
}
window.addEventListener("resize",layoutScale);

window.addEventListener("beforeunload", e => {
  if (modified) { e.preventDefault(); e.returnValue = ""; }
});

sizeMap = Array(text.length).fill(size);
render(); tas[0].focus();
</script>
</body>
</html>
