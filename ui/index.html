<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-Writer</title>
<style>
:root{
  --bar:#f9d6d6; --fg:#111111; --mut:#5b3b3b; --bd:#111111; --ctl:#ffffff; --canvas:#f2b5b5; --warn:#ffffff; --warnfg:#111111; --press:#b9b9b9; --bw:3px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); scroll-padding-bottom:50px;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bar); z-index:30;}
body{margin:0; background:var(--canvas); color:var(--fg); font:14px/1.4 "RW Liberation Sans";}
#app{min-height:100vh; display:flex; flex-direction:column;}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bar); border-bottom:var(--bw) solid var(--bd);}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px;}
.bar select,.bar input[type=text],.bar button{background:var(--ctl); color:var(--fg); border:var(--bw) solid var(--bd); border-radius:6px; padding:5px 10px; font:inherit;}
.bar button{cursor:pointer;}
.bar button:hover{background:#e4e4e4;}
.bar button:active,.dlg button:active,#ask button:active{background:var(--press); color:#111; border-color:#111;}
.bar input[type=text]{width:130px;}
.bar label{color:var(--mut); font-size:13px;}
.sep{width:1px; height:20px; background:var(--bd);}
#ask{display:none; align-items:center; gap:8px; padding:6px 12px; background:var(--warn); color:var(--warnfg); font-size:13px; border-top:var(--bw) solid var(--bd);}
#ask button{background:transparent; color:inherit; border:var(--bw) solid currentColor; border-radius:6px; padding:3px 10px; font:inherit; cursor:pointer;}
.dlg{background:var(--bar); color:var(--fg); border:var(--bw) solid var(--bd); border-radius:12px; padding:16px 20px; min-width:280px; max-width:90vw; display:flex; flex-direction:column; gap:10px;}
.dlg h2{margin:0; font-size:16px; font-weight:500;}
.dlg label{display:flex; align-items:center; gap:8px; cursor:pointer;}
.dlg small{color:var(--mut);}
.dlg .row{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
.dlg button{background:var(--ctl); color:var(--fg); border:var(--bw) solid var(--bd); border-radius:6px; padding:5px 14px; font:inherit; cursor:pointer;}
#canvas{flex:1; background:var(--canvas); padding:20px 0 40px;}
#scaler{margin:0 auto; transform-origin:top center;}
.sheet{position:relative; background:#fff; border-radius:2px; box-shadow:0 0 0 var(--bw) #111; overflow:hidden;}
.sheet .pg{scroll-margin:90px 0 50px; position:absolute; border:0; outline:0; overflow:hidden; background:transparent; color:#111; caret-color:#111; padding:0; margin:0; white-space:pre-wrap; overflow-wrap:break-word; tab-size:4; cursor:text; -webkit-user-select:text; user-select:text;}
.ff1{font-family:'RW Liberation Sans','Liberation Sans',sans-serif;} .ff2{font-family:'RW Liberation Mono','Liberation Mono',monospace;}
.fb{font-weight:700;} .fi{font-style:italic;} .fu{text-decoration:underline;}
.bar button.fmt{min-width:34px; padding:5px 0; text-align:center; line-height:1.2;}
.bar button.fmt.on,.bar button.fmt.on:hover{background:var(--press);}
.status{position:sticky; bottom:env(safe-area-inset-bottom,0px); z-index:20; padding:6px 12px; border-top:var(--bw) solid var(--bd); color:var(--mut); font-size:13px; background:var(--bar);}
@font-face{font-family:"RW Liberation Serif"; src:url("fonts/LiberationSerif-Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Serif"; src:url("fonts/LiberationSerif-Bold.woff") format("woff"); font-weight:700; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Serif"; src:url("fonts/LiberationSerif-Italic.woff") format("woff"); font-weight:400; font-style:italic; font-display:block;}
@font-face{font-family:"RW Liberation Serif"; src:url("fonts/LiberationSerif-BoldItalic.woff") format("woff"); font-weight:700; font-style:italic; font-display:block;}
@font-face{font-family:"RW Liberation Sans"; src:url("fonts/LiberationSans-Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Sans"; src:url("fonts/LiberationSans-Bold.woff") format("woff"); font-weight:700; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Sans"; src:url("fonts/LiberationSans-Italic.woff") format("woff"); font-weight:400; font-style:italic; font-display:block;}
@font-face{font-family:"RW Liberation Sans"; src:url("fonts/LiberationSans-BoldItalic.woff") format("woff"); font-weight:700; font-style:italic; font-display:block;}
@font-face{font-family:"RW Liberation Mono"; src:url("fonts/LiberationMono-Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Mono"; src:url("fonts/LiberationMono-Bold.woff") format("woff"); font-weight:700; font-style:normal; font-display:block;}
@font-face{font-family:"RW Liberation Mono"; src:url("fonts/LiberationMono-Italic.woff") format("woff"); font-weight:400; font-style:italic; font-display:block;}
@font-face{font-family:"RW Liberation Mono"; src:url("fonts/LiberationMono-BoldItalic.woff") format("woff"); font-weight:700; font-style:italic; font-display:block;}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <button id="openBtn" title="Ctrl+O">Open&hellip;</button>
      <button id="saveBtn" title="Ctrl+S">Save</button>
      <label>Name <input id="nameIn" type="text" value="document" aria-label="File name"></label>
      <span class="sep"></span>
      <select id="pageSel" aria-label="Page size"><option value="A4">A4</option><option value="A3">A3</option><option value="A5">A5</option></select>
      <select id="fontSel" aria-label="Font"></select>
      <span class="sep"></span>
      <button id="boldBtn" class="fmt" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button>
      <button id="italicBtn" class="fmt" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
      <button id="underBtn" class="fmt" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button>
    </div>
    <div id="ask"><span>Discard your unsaved changes?</span><button id="askYes">Discard</button><button id="askNo">Cancel</button></div>
  </div>
  <input id="fileIn" type="file" accept=".docx,.odt,.txt" hidden>
  <div id="saveDlg" style="display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); align-items:center; justify-content:center;">
    <div class="dlg" role="dialog" aria-label="Save document">
      <h2>Save document</h2>
      <label><input type="radio" name="fmt" value="docx" checked> Word document (.docx)</label>
      <label><input type="radio" name="fmt" value="odt"> OpenDocument text (.odt)</label>
      <label><input type="radio" name="fmt" value="txt"> Plain text (.txt)</label>
      <div class="row"><button id="dlgCancel">Cancel</button><button id="dlgSave">Save</button></div>
    </div>
  </div>
  <div id="canvas"><div id="scaler"><div id="pages"></div></div></div>
  <div class="status" id="status"></div>
</div>
<script src="jszip.min.js"></script>
<script>
const FONTS = [
  ["Liberation Serif", "'RW Liberation Serif'", "Liberation Serif", 400, "normal"],
  ["Liberation Sans", "'RW Liberation Sans'", "Liberation Sans", 400, "normal"],
  ["Liberation Mono", "'RW Liberation Mono'", "Liberation Mono", 400, "normal"]
];
const SIZES = { A3:[1123,1587], A4:[794,1123], A5:[559,794] };
const TWIPS = { A3:[16838,23811], A4:[11906,16838], A5:[8391,11906] };
const ODT_DIMS = { A3: ["297mm", "420mm"], A4: ["210mm", "297mm"], A5: ["148mm", "210mm"] };
const M = 48, GAP = 24;

let text = "", fmt = "", pageKey = "A4", fontIdx = 0, size = 14;
let ranges = [[0,0]], pending = null, curPage = 0, curScale = 1;
let pgs = [], pgKey = [], sheets = [];
let modified = false, message = "";

/* Formatting model: `fmt` is a string the same length as `text`. Each character holds one code
   (char code - 48) = style bits 1 bold, 2 italic, 4 underline, plus font family number * 8
   (0 Serif, 1 Sans, 2 Mono). A character's own code never changes unless you change that character.
   `typing` is the format given to newly typed text; changing it never touches existing text. */
const FB = 1, FI = 2, FU = 4;
let typing = 0, lastG = -1, composing = false, clip = null;
let savedSel = null;
let undoSt = [], redoSt = [], lastKind = "", lastT = 0;

const $ = id => document.getElementById(id);
const pagesEl = $("pages"), scaler = $("scaler"), canvas = $("canvas");

const meas = document.createElement("div");
meas.style.cssText = "position:absolute;left:-99999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;padding:0;margin:0;border:0;box-sizing:content-box;tab-size:4;";
document.body.appendChild(meas);

FONTS.forEach((f,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=f[0]; $("fontSel").appendChild(o); });
$("fontSel").value = fontIdx;

function escapeHtml(s){ return s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\uFFFE\uFFFF]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* display escaping must keep every character, so the DOM text stays the same length as `text` */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const fch = n => String.fromCharCode(48+n);
const fat = i => (i>=0 && i<fmt.length) ? fmt.charCodeAt(i)-48 : 0;
const typingAt = g => g>0 ? fat(g-1) : fat(0);
const cls = f => ((f&FB?" fb":"")+(f&FI?" fi":"")+(f&FU?" fu":"")+((f>>3)?" ff"+(f>>3):"")).trim();

/* HTML for the global character range [a,b), one <span> per run of identical formatting */
function runsHtml(a,b){
  let h="", i=a;
  while(i<b){
    const f=fmt.charCodeAt(i); let j=i+1;
    while(j<b && fmt.charCodeAt(j)===f) j++;
    const seg=esc(text.slice(i,j));
    h += f===48 ? seg : '<span class="'+cls(f-48)+'">'+seg+'</span>';
    i=j;
  }
  return h;
}
const EOF = '<span class="eof">\u200b</span>';   /* keeps a trailing newline visible as an empty last line */

function dims(){ const [pw,ph]=SIZES[pageKey]; return {pw, ph, cw:pw-2*M, ch:ph-2*M, lh:Math.round(size*1.35)}; }
function applyMeas(){ const d=dims(); meas.style.width=d.cw+"px"; meas.style.fontFamily=FONTS[fontIdx][1]; meas.style.fontWeight=FONTS[fontIdx][3]; meas.style.fontStyle=FONTS[fontIdx][4]; meas.style.fontSize=size+"px"; meas.style.lineHeight=d.lh+"px"; }
function height(a,b){ meas.innerHTML = runsHtml(a,b) + "\u200b"; return meas.offsetHeight; }
function rowOf(a, off){ return Math.round(height(a,off)/dims().lh) - 1; }
function rowStart(a, off){ const r=rowOf(a,off); let lo=a, hi=off; while(lo<hi){ const mid=(lo+hi)>>1; if(rowOf(a,mid)>=r) hi=mid; else lo=mid+1; } return lo; }

/* how many characters from `start` fit in maxH; `hi` is a length known not to fit */
function fitCount(start, hi, maxH){
  let lo=0;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(height(start,start+mid)<=maxH) lo=mid; else hi=mid-1; }
  let k=Math.max(lo,1);
  if(start+k<text.length && !/\s/.test(text[start+k-1]) && !/\s/.test(text[start+k])){
    for(let j=k-1;j>0;j--){ if(/\s/.test(text[start+j-1])){ k=j; break; } }
  }
  return k;
}

function paginate(){
  applyMeas();
  const {ch}=dims(); const N=text.length;
  ranges=[]; let start=0;
  for(;;){
    let hi=Math.min(N-start,1500);
    while(start+hi<N && height(start,start+hi)<=ch) hi=Math.min(N-start,hi*2);
    if(start+hi>=N && height(start,N)<=ch){ ranges.push([start,N]); break; }
    const cut=fitCount(start,hi,ch);
    ranges.push([start,start+cut]); start+=cut;
    if(start>=N){ ranges.push([start,start]); break; }
  }
}

function ensureSheets(n){
  const d=dims();
  while(sheets.length<n){
    const sh=document.createElement("div"); sh.className="sheet";
    const pg=document.createElement("div"); pg.className="pg"; pg.contentEditable="true"; pg.spellcheck=false;
    pg.setAttribute("role","textbox"); pg.setAttribute("aria-multiline","true"); pg.setAttribute("aria-label","Page text");
    const idx=sheets.length;
    pg.addEventListener("beforeinput",e=>onBeforeInput(e,idx));
    pg.addEventListener("input",()=>{ if(!composing) syncFromDom(idx); });
    pg.addEventListener("keydown",e=>onKey(e,idx));
    pg.addEventListener("paste",onPaste);
    pg.addEventListener("copy",onCopy);
    pg.addEventListener("cut",onCut);
    pg.addEventListener("dragstart",e=>e.preventDefault());
    pg.addEventListener("dragover",e=>e.preventDefault());
    pg.addEventListener("drop",e=>e.preventDefault());
    pg.addEventListener("compositionstart",()=>{ composing=true; });
    pg.addEventListener("compositionend",()=>{ composing=false; setTimeout(()=>{ if(!composing) syncFromDom(idx); },0); });
    pg.addEventListener("focus",()=>{ curPage=idx; updateStatus(); });
    sh.appendChild(pg); pagesEl.appendChild(sh); sheets.push(sh); pgs.push(pg); pgKey.push(null);
  }
  while(sheets.length>n){ const sh=sheets.pop(); pgs.pop(); pgKey.pop(); sh.remove(); }
  sheets.forEach((sh,i)=>{
    sh.style.width=d.pw+"px"; sh.style.height=d.ph+"px"; sh.style.marginBottom=GAP+"px";
    const pg=pgs[i];
    pg.style.left=M+"px"; pg.style.top=M+"px"; pg.style.width=d.cw+"px"; pg.style.height=d.ch+"px";
    pg.style.fontFamily=FONTS[fontIdx][1]; pg.style.fontWeight=FONTS[fontIdx][3]; pg.style.fontStyle=FONTS[fontIdx][4]; pg.style.fontSize=size+"px"; pg.style.lineHeight=d.lh+"px";
  });
}

function layoutScale(){
  const d=dims(); const avail=canvas.clientWidth-24;
  const s=Math.min(1,avail/d.pw); curScale=s;
  scaler.style.width=d.pw+"px"; scaler.style.transform="scale("+s+")";
  scaler.style.marginBottom=(-(1-s)*(ranges.length*(d.ph+GAP)))+"px";
}

function fileName(){ return ($("nameIn").value.trim()||"document"); }
function updateStatus(){
  const words=(text.match(/\S+/g)||[]).length;
  $("status").textContent="Page "+(Math.min(curPage,ranges.length-1)+1)+" of "+ranges.length+" \u00b7 "+words+" words"+(message?" \u00b7 "+message:"");
  document.title=(modified?"*":"")+fileName()+" - R-Writer";
}

/* ---------- selection <-> model offsets ---------- */
function pgIndex(node){
  const el = node && (node.nodeType===1 ? node : node.parentElement);
  const pg = el && el.closest ? el.closest(".pg") : null;
  return pg ? pgs.indexOf(pg) : -1;
}
function gOf(node,off){
  const i=pgIndex(node); if(i<0 || i>=ranges.length) return null;
  const pg=pgs[i]; const r=document.createRange(); r.selectNodeContents(pg);
  try{ r.setEnd(node,off); }catch(e){ return null; }
  const [s,e]=ranges[i];
  return s+Math.min(r.toString().length, e-s);
}
function getSel(){
  const s=window.getSelection(); if(!s || !s.rangeCount || !s.anchorNode) return null;
  const A=gOf(s.anchorNode,s.anchorOffset), F=gOf(s.focusNode,s.focusOffset);
  if(A==null || F==null) return null;
  return {a:Math.min(A,F), b:Math.max(A,F)};
}
/* DOM point for a character offset inside page p */
function posIn(p,local){
  const pg=pgs[p]; const w=document.createTreeWalker(pg,NodeFilter.SHOW_TEXT); let n, acc=0, eofNode=null;
  while((n=w.nextNode())){
    if(n.parentNode.classList && n.parentNode.classList.contains("eof")){ eofNode=n; break; }
    const len=n.data.length;
    if(local<acc+len) return [n,local-acc];
    if(local===acc+len && n.data.charAt(len-1)!=="\n") return [n,len];
    acc+=len;
  }
  return [eofNode||pg, 0];
}
function pageOf(g,prefer){
  let p=ranges.findIndex(([s,e])=>g>=s&&g<e); if(p<0) p=ranges.length-1;
  if(prefer!=null && prefer<ranges.length && g>=ranges[prefer][0] && g<=ranges[prefer][1]) p=prefer;
  return p;
}
function putSel(g1,g2,prefer){
  g1=Math.max(0,Math.min(g1,text.length));
  const p=pageOf(g1,prefer); const pg=pgs[p];
  pg.focus({preventScroll:true});
  const sel=window.getSelection(); const [n1,o1]=posIn(p,g1-ranges[p][0]);
  if(g2==null || g2===g1){ sel.collapse(n1,o1); lastG=g1; }
  else{
    g2=Math.max(0,Math.min(g2,text.length));
    const q=pageOf(g2,prefer); const [n2,o2]=posIn(q,g2-ranges[q][0]);
    sel.setBaseAndExtent(n1,o1,n2,o2); lastG=-1;
  }
  curPage=p;
  return p;
}

function render(){
  paginate(); ensureSheets(ranges.length);
  ranges.forEach(([s,e],i)=>{ const h=runsHtml(s,e); if(pgKey[i]!==h){ pgs[i].innerHTML=h+EOF; pgKey[i]=h; } });
  layoutScale();
  if(pending){
    const pd=pending; pending=null;
    const g=Math.min(pd.g,text.length);
    if(pd.nav) typing=typingAt(g);
    const p=putSel(g,pd.g2,pd.prefer);
    const local=g-ranges[p][0]; const d=dims(); const lhs=d.lh*curScale;
    const y=pgs[p].getBoundingClientRect().top+(rowOf(ranges[p][0],g)+1)*lhs;
    const barH=document.querySelector(".top").offsetHeight, stH=$("status").offsetHeight;
    if(y-lhs<barH+8) window.scrollBy(0,y-lhs-barH-40);
    else if(y>innerHeight-stH-8) window.scrollBy(0,y-innerHeight+stH+40);
  }
  updateStatus(); updateFmtUi();
}

/* ---------- undo / redo ---------- */
function snap(sel){ return {text, fmt, a:sel?sel.a:0, b:sel?sel.b:0}; }
function pushUndo(kind,sel){
  const now=Date.now();
  const merge = kind==="type" && lastKind==="type" && now-lastT<1200 && sel && sel.a===sel.b;
  if(!merge){ undoSt.push(snap(sel)); if(undoSt.length>200) undoSt.shift(); }
  redoSt.length=0; lastKind=kind; lastT=now;
}
function restore(x){
  text=x.text; fmt=x.fmt; modified=true; lastKind="";
  typing=typingAt(x.a);
  pending={g:x.a, g2:x.b!==x.a?x.b:null, prefer:curPage}; render();
}
function undo(){ if(!undoSt.length) return; redoSt.push(snap(getSel())); restore(undoSt.pop()); }
function redo(){ if(!redoSt.length) return; undoSt.push(snap(getSel())); restore(redoSt.pop()); }

/* ---------- the one place the document text is changed ---------- */
function commit(a,b,ins,insFmt,kind,prefer,opt){
  opt=opt||{};
  const sel=opt.selBefore||getSel();
  pushUndo(kind,sel);
  const tp = ins ? null : (a>0 ? fat(a-1) : fat(a));      /* deleting: carry on with the format at that spot */
  text=text.slice(0,a)+ins+text.slice(b);
  fmt =fmt.slice(0,a)+insFmt+fmt.slice(b);
  modified=true;
  if(ins) typing = insFmt.length ? insFmt.charCodeAt(insFmt.length-1)-48 : typing; else typing=tp;
  const g = opt.caret!=null ? opt.caret : a+ins.length;
  pending={g, prefer};
  render();
}
const fillFmt = (n,bits) => fch(bits).repeat(n);

/* ---------- apply bold / italic / underline ---------- */
function toggleFmt(bit){
  const s=getSel();
  if(!s || s.a===s.b){ typing^=bit; updateFmtUi(); return; }   /* no selection: only affects text typed from now on */
  let allHave=true, n=0;
  for(let i=s.a;i<s.b;i++){ if(text[i]==="\n") continue; n++; if(!(fat(i)&bit)){ allHave=false; break; } }
  const turnOn = !(n>0 && allHave);
  let mid=""; for(let i=s.a;i<s.b;i++) mid+=fch(turnOn ? (fat(i)|bit) : (fat(i)&~bit));
  pushUndo("fmt",s);
  fmt=fmt.slice(0,s.a)+mid+fmt.slice(s.b);
  modified=true; pending={g:s.a, g2:s.b, prefer:curPage}; render();
}
function selFmt(){
  const s=getSel();
  if(!s || s.a===s.b) return typing;
  let all=7, n=0;
  for(let i=s.a;i<s.b;i++){ if(text[i]==="\n") continue; n++; all&=fat(i); }
  return n ? all : typing;
}
function selFamily(){
  const s=getSel();
  if(!s || s.a===s.b) return typing>>3;
  let fam=null;
  for(let i=s.a;i<s.b;i++){ if(text[i]==="\n") continue; const x=fat(i)>>3; if(fam===null) fam=x; else if(fam!==x) return -1; }
  return fam===null ? typing>>3 : fam;
}
function setFamily(fam){
  const s=getSel()||savedSel; if(!s) return;
  if(s.a===s.b){                                   /* no selection: only text typed from now on */
    typing=(typing&7)|(fam<<3); putSel(s.a,null,curPage); updateFmtUi(); return;
  }
  let mid=""; for(let i=s.a;i<s.b;i++) mid+=fch((fat(i)&7)|(fam<<3));
  pushUndo("fmt",s);
  fmt=fmt.slice(0,s.a)+mid+fmt.slice(s.b);
  modified=true; pending={g:s.a, g2:s.b, prefer:curPage}; render();
}
function updateFmtUi(){
  $("fontSel").selectedIndex = selFamily();
  const f=selFmt();
  [["boldBtn",FB],["italicBtn",FI],["underBtn",FU]].forEach(([id,bit])=>{
    const on=!!(f&bit); $(id).classList.toggle("on",on); $(id).setAttribute("aria-pressed",on?"true":"false");
  });
}

/* ---------- input handling ---------- */
const SEG = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter(undefined,{granularity:"grapheme"}) : null;
function prevBreak(g){
  if(g<=0) return 0;
  if(SEG){ const from=Math.max(0,g-64); let last=0; for(const x of SEG.segment(text.slice(from,g))) last=x.index; return from+last; }
  const c=text.charCodeAt(g-1);
  if(c>=0xDC00&&c<=0xDFFF&&g>=2){ const h=text.charCodeAt(g-2); if(h>=0xD800&&h<=0xDBFF) return g-2; }
  return g-1;
}
function nextBreak(g){
  if(g>=text.length) return text.length;
  if(SEG){ const it=SEG.segment(text.slice(g,g+64))[Symbol.iterator]().next(); if(!it.done) return g+it.value.segment.length; }
  const c=text.charCodeAt(g);
  if(c>=0xD800&&c<=0xDBFF&&g+1<text.length) return g+2;
  return g+1;
}
function targetRange(ev){
  try{
    const r=ev.getTargetRanges && ev.getTargetRanges();
    if(r && r.length){
      const A=gOf(r[0].startContainer,r[0].startOffset), B=gOf(r[0].endContainer,r[0].endOffset);
      if(A!=null && B!=null && A<B) return [A,B];
    }
  }catch(e){}
  return null;
}
function deleteRange(t,s,ev){
  if(s.a!==s.b) return [s.a,s.b];
  const g=s.a, back=/Backward$/.test(t);
  if(t==="deleteContentBackward") return [prevBreak(g),g];
  if(t==="deleteContentForward") return [g,nextBreak(g)];
  const tr=targetRange(ev); if(tr) return tr;
  if(/Word/.test(t)){
    if(back){ const m=text.slice(Math.max(0,g-200),g).match(/[^\S\n]*(?:[\p{L}\p{N}_]+|[^\p{L}\p{N}_\s]+|\n)$/u); if(m) return [g-m[0].length,g]; }
    else{ const m=text.slice(g,g+200).match(/^(?:[\p{L}\p{N}_]+|[^\p{L}\p{N}_\s]+|\n)[^\S\n]*/u); if(m) return [g,g+m[0].length]; }
  }else if(/Line/.test(t)){
    if(back) return [text.lastIndexOf("\n",g-1)+1,g];
    let k=text.indexOf("\n",g); if(k<0) k=text.length; return [g,k>g?k:Math.min(g+1,text.length)];
  }
  return back ? [prevBreak(g),g] : [g,nextBreak(g)];
}

function insertPlain(str,kind){
  const s=getSel(); if(!s || !str) return;
  str=str.replace(/\r\n?/g,"\n");
  const f = (clip && clip.text===str) ? clip.fmt : fillFmt(str.length, s.a===s.b ? typing : fat(s.a));
  commit(s.a,s.b,str,f,kind||"paste",curPage);
}

function onBeforeInput(ev,i){
  if(composing || ev.isComposing) return;          /* IME text is picked up when the composition ends */
  const t=ev.inputType||""; const s=getSel(); if(!s) return;
  const bitsNow = s.a===s.b ? typing : fat(s.a);
  switch(t){
    case "insertText": {
      let d = ev.data!=null ? ev.data : (ev.dataTransfer ? ev.dataTransfer.getData("text/plain") : null);
      if(d==null) return;
      ev.preventDefault(); d=d.replace(/\r\n?/g,"\n");
      commit(s.a,s.b,d,fillFmt(d.length,bitsNow),"type",i); return; }
    case "insertParagraph": case "insertLineBreak":
      ev.preventDefault(); commit(s.a,s.b,"\n",fillFmt(1,bitsNow),"enter",null); return;
    case "insertFromPaste": case "insertFromYank": case "insertFromDrop": {
      ev.preventDefault();
      const d=ev.dataTransfer ? ev.dataTransfer.getData("text/plain") : "";
      if(d && t!=="insertFromDrop") insertPlain(d); return; }
    case "historyUndo": ev.preventDefault(); undo(); return;
    case "historyRedo": ev.preventDefault(); redo(); return;
    case "formatBold": ev.preventDefault(); toggleFmt(FB); return;
    case "formatItalic": ev.preventDefault(); toggleFmt(FI); return;
    case "formatUnderline": ev.preventDefault(); toggleFmt(FU); return;
    case "deleteByDrag": ev.preventDefault(); return;
  }
  if(t.indexOf("delete")===0){
    ev.preventDefault();
    const [a,b]=deleteRange(t,s,ev);
    if(b>a) commit(a,b,"","",t==="deleteByCut"?"cut":"del",curPage);
    return;
  }
  if(t.indexOf("format")===0) ev.preventDefault();  /* no other native formatting */
}

/* Fallback for edits the browser made itself (IME, autocorrect): compare the page DOM with the model */
function domText(pg){
  let out=""; const w=document.createTreeWalker(pg,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let n;
  while((n=w.nextNode())){
    if(n.nodeType===3) out += (n.parentNode.classList && n.parentNode.classList.contains("eof")) ? n.data.replace(/\u200b/g,"") : n.data;
    else if(n.nodeName==="BR") out+="\n";
  }
  return out;
}
function syncFromDom(i){
  if(i>=ranges.length) return;
  const [s,e]=ranges[i]; const old=text.slice(s,e); const now=domText(pgs[i]);
  const sel=window.getSelection();
  let c=now.length;
  if(sel && sel.rangeCount && sel.focusNode && pgIndex(sel.focusNode)===i){
    const r=document.createRange(); r.selectNodeContents(pgs[i]);
    try{ r.setEnd(sel.focusNode,sel.focusOffset); c=Math.min(r.toString().replace(/\u200b/g,"").length, now.length); }catch(err){}
  }
  pgKey[i]=null;                                   /* always redraw this page from the model */
  if(now===old){ pending={g:s+c, prefer:i}; render(); return; }
  const m=Math.min(old.length,now.length); let p=0; while(p<m && old[p]===now[p]) p++;
  const delta=now.length-old.length;
  p=Math.min(p, Math.max(0,c-Math.max(delta,0)));
  let q=0; while(q<m-p && old[old.length-1-q]===now[now.length-1-q]) q++;
  const ins=now.slice(p,now.length-q);
  commit(s+p, s+old.length-q, ins, fillFmt(ins.length,typing), "type", i, {selBefore:{a:s+p,b:s+old.length-q}, caret:s+c});
}

function onPaste(e){
  const cd=e.clipboardData; if(!cd) return;
  e.preventDefault(); insertPlain(cd.getData("text/plain")||"");
}
function onCopy(e){
  const s=getSel(); if(!s || s.a===s.b || !e.clipboardData) return;
  e.preventDefault(); const t=text.slice(s.a,s.b);
  e.clipboardData.setData("text/plain",t); clip={text:t, fmt:fmt.slice(s.a,s.b)};
}
function onCut(e){
  const s=getSel(); if(!s || s.a===s.b || !e.clipboardData) return;
  e.preventDefault(); const t=text.slice(s.a,s.b);
  e.clipboardData.setData("text/plain",t); clip={text:t, fmt:fmt.slice(s.a,s.b)};
  commit(s.a,s.b,"","","cut",curPage);
}

function onKey(ev,i){
  if(ev.isComposing || composing) return;
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod && !ev.altKey){
    const k=(ev.key||"").toLowerCase();
    if(k==="b"){ ev.preventDefault(); toggleFmt(FB); return; }
    if(k==="i"){ ev.preventDefault(); toggleFmt(FI); return; }
    if(k==="u"){ ev.preventDefault(); toggleFmt(FU); return; }
    if(k==="z"){ ev.preventDefault(); if(ev.shiftKey) redo(); else undo(); return; }
    if(k==="y"){ ev.preventDefault(); redo(); return; }
  }
  if(ev.key==="Enter" && !mod && !ev.altKey){
    ev.preventDefault(); const s=getSel(); if(!s) return;
    commit(s.a,s.b,"\n",fillFmt(1,s.a===s.b?typing:fat(s.a)),"enter",null); return;
  }
  if(mod||ev.altKey||ev.shiftKey) return;
  const s=getSel(); if(!s || s.a!==s.b) return;
  const g=s.a; const [ps,pe]=ranges[i]; const local=g-ps; const n=ranges.length;
  const go=x=>{ ev.preventDefault(); pending={g:x, nav:true}; render(); };
  switch(ev.key){
    case "ArrowLeft": if(local===0 && i>0) go(ps-1); break;
    case "ArrowRight": if(g===pe && i<n-1) go(Math.min(pe+1,text.length)); break;
    case "ArrowUp":
      if(i>0 && rowOf(ps,g)===0){
        const col=local; const [qs,qe]=ranges[i-1];
        const rs=rowStart(qs,qe); let len=qe-rs; if(text[qe-1]==="\n") len=Math.max(len-1,0);
        go(rs+Math.min(col,len));
      } break;
    case "ArrowDown":
      if(i<n-1 && rowOf(ps,g)===rowOf(ps,pe)){
        const col=g-rowStart(ps,g); const [ns,ne]=ranges[i+1];
        let k=0; while(ns+k<ne && rowOf(ns,ns+k+1)<1 && text[ns+k]!=="\n") k++;
        go(ns+Math.min(col,k));
      } break;
  }
}

/* caret moved by the user: typing format follows the character before the caret */
document.addEventListener("selectionchange",()=>{
  if(composing) return;
  const s=getSel(); if(!s) return;
  savedSel=s;
  const sel=window.getSelection(); const p=pgIndex(sel.anchorNode);
  if(p>=0 && p!==curPage){ curPage=p; updateStatus(); }
  if(s.a===s.b && s.a!==lastG){ typing=typingAt(s.a); lastG=s.a; lastKind=""; }
  updateFmtUi();
});
[["boldBtn",FB],["italicBtn",FI],["underBtn",FU]].forEach(([id,bit])=>{

  $(id).addEventListener("click",()=>toggleFmt(bit));

/* ---------- robust file import parsers (text + per-character formatting) ---------- */
function richBuf(){
  return { t:"", f:"", add(str,bits){ str=str.replace(/\r/g,""); this.t+=str; this.f+=fch(bits).repeat(str.length); } };
}
function wOn(el){ const v=el.getAttribute("w:val"); return !(v==="0"||v==="false"||v==="off"||v==="none"); }
function famFromName(n){
  n=(n||"").toLowerCase();
  if(/mono|courier|consolas|menlo|monaco|code/.test(n)) return 2;
  if(/sans|arial|helvetica|calibri|verdana|tahoma|segoe|roboto|lato|inter\b/.test(n) && !/serif/.test(n.replace(/sans.?serif/,""))) return 1;
  return 0;
}
function runBits(run){
  let bits=0;
  for(const c of run.childNodes){
    if(c.nodeType!==1 || c.nodeName!=="w:rPr") continue;
    for(const x of c.childNodes){
      if(x.nodeType!==1) continue;
      if(x.nodeName==="w:rFonts"){ bits=(bits&7)|(famFromName(x.getAttribute("w:ascii")||x.getAttribute("w:hAnsi"))<<3); }
      else if(x.nodeName==="w:b" && wOn(x)) bits|=FB;
      else if(x.nodeName==="w:i" && wOn(x)) bits|=FI;
      else if(x.nodeName==="w:u" && wOn(x)) bits|=FU;
    }
  }
  return bits;
}
function docxRich(xmlStr){
  try{
    const doc=new DOMParser().parseFromString(xmlStr,"text/xml");
    const out=richBuf(); let first=true;
    for(const p of doc.getElementsByTagName("w:p")){
      if(!first) out.add("\n",0); first=false;
      for(const r of p.getElementsByTagName("w:r")){
        const bits=runBits(r); let s="";
        for(const t of r.getElementsByTagName("w:t")) s+=t.textContent;
        if(s) out.add(s,bits);
      }
    }
    return {text:out.t, fmt:out.f};
  }catch(e){ return {text:"", fmt:""}; }
}

function odtRich(xmlStr){
  try{
    const doc=new DOMParser().parseFromString(xmlStr,"text/xml");
    const styles={};
    for(const st of doc.getElementsByTagName("style:style")){
      const name=st.getAttribute("style:name"); let bits=0, fam=null;
      for(const tp of st.getElementsByTagName("style:text-properties")){
        const ff=tp.getAttribute("fo:font-family")||tp.getAttribute("style:font-name"); if(ff) fam=famFromName(ff.replace(/['"]/g,""));
        if(tp.getAttribute("fo:font-weight")==="bold") bits|=FB;
        const fs=tp.getAttribute("fo:font-style"); if(fs==="italic"||fs==="oblique") bits|=FI;
        const u=tp.getAttribute("style:text-underline-style"); if(u && u!=="none") bits|=FU;
      }
      styles[name]={bits,fam};
    }
    const out=richBuf();
    const merge=(cur,sv)=>{ if(!sv) return cur; return ((cur&7)|sv.bits) | ((sv.fam!=null ? sv.fam : cur>>3)<<3); };
    const walk=(node,bits)=>{
      for(const c of node.childNodes){
        if(c.nodeType===3){ out.add(c.data,bits); continue; }
        if(c.nodeType!==1) continue;
        if(c.nodeName==="text:s"){ out.add(" ".repeat(parseInt(c.getAttribute("text:c")||"1",10)||1),bits); }
        else if(c.nodeName==="text:tab"){ out.add("\t",bits); }
        else if(c.nodeName==="text:line-break"){ out.add("\n",bits); }
        else walk(c, c.nodeName==="text:span" ? merge(bits,styles[c.getAttribute("text:style-name")]) : bits);
      }
    };
    let first=true;
    for(const p of doc.getElementsByTagName("text:p")){
      if(!first) out.add("\n",0); first=false;
      walk(p, merge(0,styles[p.getAttribute("text:style-name")]));
    }
    return {text:out.t, fmt:out.f};
  }catch(e){ return {text:"", fmt:""}; }
}

/* runs of identical formatting inside [a,b) */
function fmtRuns(a,b){
  const runs=[]; let i=a;
  while(i<b){ const f=fmt.charCodeAt(i)-48; let j=i+1; while(j<b && fmt.charCodeAt(j)-48===f) j++; runs.push([i,j,f]); i=j; }
  return runs;
}

/* ---------- valid spec-compliant format builders ---------- */
async function buildDocx(){
  const [w,h]=TWIPS[pageKey];
  let body=""; let pos=0;
  for(const line of text.split("\n")){
    body+="<w:p>";
    if(line === "") {
      body+="<w:r><w:t/></w:r>";
    } else {
      for(const [a,b,f] of fmtRuns(pos,pos+line.length)){
        const font=escapeHtml(FONTS[f>>3][2]);
        body+='<w:r><w:rPr><w:rFonts w:ascii="'+font+'" w:hAnsi="'+font+'"/>'+((f&FB)?"<w:b/>":"")+((f&FI)?"<w:i/>":"")+'<w:sz w:val="28"/>'+((f&FU)?'<w:u w:val="single"/>':"")+'</w:rPr><w:t xml:space="preserve">'+escapeHtml(text.slice(a,b))+'</w:t></w:r>';
      }
    }
    body+="</w:p>"; pos+=line.length+1;
  }
  const zip=new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/_rels/document.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.file("word/styles.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:spacing w:line="276" w:lineRule="auto"/></w:pPr></w:style></w:styles>');
  zip.file("word/document.xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="'+w+'" w:h="'+h+'"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

async function buildOdt(){
  const [pageW, pageH] = ODT_DIMS[pageKey] || ODT_DIMS["A4"];
  const sname = f => f ? "S_14_"+f : "S_14";
  let spanStyles="";
  for(let f=0;f<8*FONTS.length;f++){
    const font=escapeHtml(FONTS[f>>3][2]);
    spanStyles+='<style:style style:name="'+sname(f)+'" style:family="text"><style:text-properties fo:font-size="10.5pt" fo:font-family="'+font+'"'+((f&FB)?' fo:font-weight="bold"':"")+((f&FI)?' fo:font-style="italic"':"")+((f&FU)?' style:text-underline-style="solid" style:text-underline-width="auto" style:text-underline-color="font-color"':"")+'/></style:style>';
  }
  let body = ""; let pos=0;
  for(const line of text.split("\n")){
    body += '<text:p text:style-name="P1">';
    if(line==="") body += '<text:span text:style-name="S_14"></text:span>';
    else for(const [a,b,f] of fmtRuns(pos,pos+line.length)) body += '<text:span text:style-name="'+sname(f)+'">'+escapeHtml(text.slice(a,b))+'</text:span>';
    body += '</text:p>'; pos+=line.length+1;
  }

  const zip=new JSZip();
  zip.file("mimetype", "application/vnd.oasis.opendocument.text", {compression: "STORE"});
  zip.file("META-INF/manifest.xml", '<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:media-type="application/vnd.oasis.opendocument.text" manifest:version="1.2" manifest:full-path="/"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="content.xml"/><manifest:file-entry manifest:media-type="text/xml" manifest:full-path="styles.xml"/></manifest:manifest>');
  zip.file("styles.xml", '<?xml version="1.0" encoding="UTF-8"?>\n<office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles><style:page-layout style:name="pm1"><style:page-layout-properties fo:page-width="'+pageW+'" fo:page-height="'+pageH+'" fo:margin-top="2cm" fo:margin-bottom="2cm" fo:margin-left="2cm" fo:margin-right="2cm"/></style:page-layout></office:automatic-styles><office:master-styles><style:master-page style:name="Standard" style:page-layout-name="pm1"/></office:master-styles></office:document-styles>');
  zip.file("content.xml", '<?xml version="1.0" encoding="UTF-8"?>\n<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" xmlns:svg="urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0" office:version="1.2"><office:automatic-styles><style:style style:name="P1" style:family="paragraph"><style:paragraph-properties fo:margin-top="0cm" fo:margin-bottom="0cm"/></style:style>'+spanStyles+'</office:automatic-styles><office:body><office:text>'+body+'</office:text></office:body></office:document-content>');
  return zip.generateAsync({type:"blob",compression:"DEFLATE"});
}

/* ---------- toolbar actions ---------- */
let afterAsk=null;
function guard(fn){ if(!modified){ fn(); return; } afterAsk=fn; $("ask").style.display="flex"; }
$("askYes").onclick=()=>{ $("ask").style.display="none"; const f=afterAsk; afterAsk=null; if(f) f(); };
$("askNo").onclick=()=>{ $("ask").style.display="none"; afterAsk=null; };

function openDlg(){ $("fileIn").value=""; $("fileIn").click(); }

$("fileIn").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    let r;
    if(ext==="txt") r={text:(await f.text()).replace(/\r\n?/g,"\n"), fmt:null};
    else{
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      if(ext==="docx") r=docxRich(await z.file("word/document.xml").async("string"));
      else if(ext==="odt") r=odtRich(await z.file("content.xml").async("string"));
      else throw new Error("use a .docx, .odt or .txt file");
    }
    text=r.text; fmt=(r.fmt!=null && r.fmt.length===text.length) ? r.fmt : "0".repeat(text.length);
    undoSt=[]; redoSt=[]; lastKind=""; typing=0; modified=false; message="Opened "+f.name;
    $("nameIn").value=f.name.replace(/\.[^.]+$/,"" );
    pending={g:0, prefer:0}; render();
  }catch(err){ message="Open failed: "+(err&&err.message?err.message:err); updateStatus(); }
});

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function save(fmt){
  try{
    let blob, fname;
    if(fmt === "odt"){
      blob = await buildOdt();
      fname = fileName() + ".odt";
    } else if(fmt === "txt"){
      blob = new Blob([text], {type: "text/plain;charset=utf-8"});
      fname = fileName() + ".txt";
    } else {
      blob = await buildDocx();
      fname = fileName() + ".docx";
    }
    triggerDownload(blob, fname);
    modified = false;
    message = "Saved " + fname;
  }catch(err){
    message = "Save failed: " + (err && err.message ? err.message : err);
  }
  updateStatus();
}

function showSave(){ $("saveDlg").style.display="flex"; }
$("dlgCancel").onclick=()=>{ $("saveDlg").style.display="none"; };
$("dlgSave").onclick=()=>{ $("saveDlg").style.display="none"; const f=document.querySelector('input[name="fmt"]:checked').value; save(f); };
$("openBtn").onclick=()=>guard(openDlg);
$("saveBtn").onclick=showSave;
$("nameIn").addEventListener("input",updateStatus);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("saveDlg").style.display="none";
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==="s"){ e.preventDefault(); showSave(); }
  else if(k==="o"){ e.preventDefault(); guard(openDlg); }
});

$("pageSel").addEventListener("change",e=>{ pageKey=e.target.value; keep(); });
function loadFont(){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  const loads=[];
  for(const f of FONTS) for(const st of ["normal","italic"]) for(const w of [400,700]) loads.push(document.fonts.load(st+" "+w+" "+size+"px "+f[1],"Aa"));
  loads.push(document.fonts.load('14px "RW Liberation Sans"',"Aa"));
  return Promise.all(loads).catch(()=>{});
}
$("fontSel").addEventListener("change",e=>setFamily(+e.target.value));

function keep(){
  const s=getSel();
  const g = s ? s.a : (lastG>=0 ? lastG : 0);
  pending = { g, g2: (s && s.b!==s.a) ? s.b : null, prefer: curPage };
  render();
}
window.addEventListener("resize",layoutScale);

window.addEventListener("beforeunload", e => {
  if (modified) { e.preventDefault(); e.returnValue = ""; }
});

render(); pgs[0].focus();
loadFont().then(keep);   // re-measure once the bundled font has loaded
</script>
</body>
